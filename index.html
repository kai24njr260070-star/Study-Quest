<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STUDY QUEST</title>
<style>
  :root{
    --gold:#ffd447;
    --gold-d:#8a5f00;
    --panel-a:rgba(6,13,24,.97);
    --panel-b:rgba(1,4,9,.99);
    --line:#ffffff;
    --muted:#8ea4bf;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:#000;color:#fff;overflow:hidden;
    font-family:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic",monospace;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    letter-spacing:.4px;
  }
  #bg{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;z-index:0}

  /* ---------- 画面切り替え ---------- */
  .screen{
    position:fixed;inset:0;z-index:1;
    opacity:1;transform:none;
    transition:opacity .4s ease, transform .5s cubic-bezier(.2,.8,.3,1);
  }
  .screen.hide{opacity:0;transform:scale(1.04);pointer-events:none}
  .off{display:none !important}

  /* ---------- DQ風ウィンドウ ---------- */
  .win{
    background:linear-gradient(180deg,var(--panel-a),var(--panel-b));
    border:3px solid var(--line);
    border-radius:7px;
    box-shadow:inset 0 0 0 2px #000, 0 10px 30px rgba(0,0,0,.55), 0 0 26px rgba(120,180,255,.06);
  }

  /* ================= タイトル ================= */
  #title{display:flex;align-items:center;justify-content:center;padding:24px}
  .title-inner{
    width:min(460px,100%);
    display:flex;flex-direction:column;align-items:center;gap:26px;text-align:center;
    opacity:0;transform:scale(1.08);
    transition:opacity 1s ease,transform 1.6s cubic-bezier(.2,.8,.3,1);
  }
  #title.go .title-inner{opacity:1;transform:scale(1)}
  #title.go .title-inner.shake{animation:camShake .5s cubic-bezier(.36,.07,.19,.97)}
  @keyframes camShake{
    0%,100%{transform:translate(0,0)}
    15%{transform:translate(-6px,4px)}
    30%{transform:translate(6px,-4px)}
    45%{transform:translate(-4px,-3px)}
    60%{transform:translate(4px,3px)}
    80%{transform:translate(-2px,1px)}
  }
  #boot{position:fixed;inset:0;z-index:60;background:#000;opacity:1;pointer-events:none;transition:opacity 1.1s ease}
  #boot.clear{opacity:0}
  .logo-wrap{position:relative}
  .logo{
    margin:0;font-size:clamp(40px,13vw,74px);line-height:1.02;
    letter-spacing:.05em;font-weight:900;
    animation:logoFloat 4.5s ease-in-out 3s infinite, logoGlow 5s ease-in-out 3.4s infinite;
  }
  @keyframes logoGlow{
    0%,100%{filter:drop-shadow(0 0 0 rgba(255,212,71,0))}
    50%{filter:drop-shadow(0 0 26px rgba(255,214,110,.45))}
  }
  .logo .line{display:block}
  .logo .ch{
    display:inline-block;opacity:0;
    transform:scale(2.8);
    background:linear-gradient(180deg,#fffdf0 0%,#ffe680 42%,#ffc400 70%,#e08a00 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 3px 0 #4a2c00) drop-shadow(0 0 18px rgba(255,212,71,.45));
  }
  .logo.go .ch{animation:chSlam .6s cubic-bezier(.18,1.6,.34,1) forwards}
  @keyframes chSlam{
    0%{opacity:0;transform:scale(2.8);filter:blur(5px) drop-shadow(0 3px 0 #4a2c00)}
    55%{opacity:1;transform:scale(.93);filter:blur(0) drop-shadow(0 3px 0 #4a2c00) drop-shadow(0 0 26px rgba(255,225,140,.9))}
    76%{transform:scale(1.05)}
    100%{opacity:1;transform:scale(1);filter:drop-shadow(0 3px 0 #4a2c00) drop-shadow(0 0 18px rgba(255,212,71,.45))}
  }
  @keyframes logoFloat{0%,100%{transform:translateY(0) rotate(-.2deg)}50%{transform:translateY(-8px) rotate(.2deg)}}
  /* ロゴの後光 */
  .logo-wrap::before{
    content:'';position:absolute;left:50%;top:52%;width:130%;height:180%;
    transform:translate(-50%,-50%);
    background:radial-gradient(closest-side,rgba(255,212,71,.22),transparent 70%);
    filter:blur(6px);animation:halo 3.6s ease-in-out 1.2s infinite;pointer-events:none;
  }
  @keyframes halo{0%,100%{opacity:.5;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}}
  .sub{
    margin:14px 0 0;min-height:20px;
    font-size:12px;letter-spacing:.12em;color:#c6dcf7;
    opacity:0;transition:opacity .5s ease 1.7s;
  }
  #title.go .sub{opacity:1}
  #title.ready .sub::after{
    content:'▌';margin-left:2px;color:var(--gold);
    animation:blink 1s steps(2,start) infinite;
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

  .tbtns{
    display:flex;gap:12px;width:100%;
    opacity:0;transform:translateY(18px);pointer-events:none;
    transition:opacity .7s ease,transform .7s cubic-bezier(.2,1,.3,1);
  }
  #title.ready .tbtns{opacity:1;transform:none;pointer-events:auto}
  .tbtn{
    position:relative;overflow:hidden;flex:1;
    padding:15px 10px;font-family:inherit;font-size:17px;font-weight:900;letter-spacing:.18em;
    border:none;border-radius:9px;cursor:pointer;
    transition:transform .12s,box-shadow .18s,filter .18s;
  }
  .tbtn.play{
    color:#1b1405;background:linear-gradient(180deg,#ffe89b,#e8b52a);
    box-shadow:0 6px 0 var(--gold-d),0 12px 26px rgba(0,0,0,.5);
  }
  .tbtn.exit{
    color:#dbe8f7;background:linear-gradient(180deg,#1b2a41,#0b1524);
    box-shadow:0 6px 0 #0a1220,0 12px 26px rgba(0,0,0,.5),inset 0 0 0 2px #3d5a7d;
  }
  .tbtn:hover{filter:brightness(1.08)}
  .tbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #000}
  .tbtn.play::after{
    content:'';position:absolute;top:0;left:-70%;width:45%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);
    animation:shine 2.8s 2.4s infinite;
  }
  @keyframes shine{0%{left:-70%}55%{left:130%}100%{left:130%}}
  .title-foot{
    font-size:10px;color:#6f86a2;letter-spacing:.18em;
    opacity:0;transition:opacity .8s ease .4s;
  }
  #title.ready .title-foot{opacity:1}

  /* ================= 難易度 ================= */
  #grades{display:flex;align-items:center;justify-content:center;padding:22px}
  .grades-inner{
    width:min(520px,100%);
    display:flex;flex-direction:column;gap:14px;
    max-height:100%;overflow-y:auto;
  }
  .gtitle{
    margin:0;text-align:center;font-size:22px;letter-spacing:.2em;color:var(--gold);
    text-shadow:0 3px 0 #4a2c00,0 0 20px rgba(255,212,71,.4);
  }
  .gdesc{margin:0;text-align:center;font-size:11.5px;color:var(--muted)}
  .panelbox{padding:14px 13px 12px}
  .grades{display:flex;flex-direction:column;gap:8px}
  .grp{display:flex;align-items:center;gap:6px}
  .glabel{width:38px;font-size:10.5px;color:#7f95af;flex:0 0 auto}
  .gbtn{
    flex:1 1 0;min-width:40px;padding:9px 2px;
    font-family:inherit;font-size:12px;font-weight:700;color:#dceaff;
    background:#0b1626;border:2px solid #3b587c;border-radius:6px;cursor:pointer;
    transition:background .14s,border-color .14s,transform .1s,box-shadow .2s,color .14s;
  }
  .gbtn:hover{background:#16283f;border-color:#7fa8d4;transform:translateY(-1px)}
  .gbtn:active{transform:translateY(1px)}
  .gbtn.on{
    color:#1b1405;border-color:#ffe27a;
    background:linear-gradient(180deg,#ffe89b,#e8b52a);
    box-shadow:0 0 16px rgba(255,212,71,.6),0 0 0 2px rgba(255,212,71,.25);
  }
  .phint{margin-top:10px;font-size:11px;color:var(--gold);text-align:center}
  .gbtns{display:flex;gap:12px}

  /* ================= バトル ================= */
  #battle{display:flex;flex-direction:column;justify-content:flex-end;padding:10px;gap:8px}
  .hud{
    width:min(172px,48%);flex:0 0 auto;
    padding:7px 9px;font-size:10.5px;line-height:1.45;
  }
  .hud.danger{border-color:#ff8a8a;animation:dangerPulse 1.1s ease-in-out infinite}
  @keyframes dangerPulse{
    0%,100%{box-shadow:inset 0 0 0 2px #000,0 0 12px rgba(255,60,60,.3)}
    50%{box-shadow:inset 0 0 0 2px #000,0 0 24px rgba(255,60,60,.8)}
  }
  .hud-row{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
  .hud .who{font-weight:800;letter-spacing:.1em}
  .hud .lv{color:var(--gold);font-weight:800}
  .hud-bar{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:10px;color:var(--muted)}
  .hud-bar i{
    flex:1;height:7px;background:#0c1626;border:1px solid #2a4060;border-radius:2px;
    overflow:hidden;position:relative;display:block;
  }
  .hud-bar i b{display:block;height:100%;width:100%;transition:width .45s cubic-bezier(.2,.8,.3,1)}
  .hud-bar.hp i b{background:linear-gradient(180deg,#ff9d9d,#d32f2f)}
  .hud-bar.exp i b{background:linear-gradient(180deg,#9cf0bb,#22a35a)}
  .hud-bar.mp i b{background:linear-gradient(180deg,#a9cdff,#3b6fd4)}
  .hud-bar .num{font-family:ui-monospace,monospace;color:#dbe8f7;min-width:56px;text-align:right}
  .hud-weapon{margin-top:5px;font-size:10.5px;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hud-grade{
    position:absolute;top:10px;right:10px;
    font-size:11px;padding:4px 9px;border-radius:4px;
    border:2px solid #3d5a7d;background:rgba(6,13,24,.9);color:#cfe3ff;
  }
  .bottom{
    margin-top:auto;display:flex;flex-direction:column;gap:7px;width:100%;
  }
  .lower-row{display:flex;align-items:flex-end;gap:7px;width:100%}
  .cmd{
    margin-left:auto;width:min(172px,46%);
    padding:5px;display:flex;flex-direction:column;gap:1px;
    max-height:42vh;overflow-y:auto;
    opacity:1;transform:none;transition:opacity .25s,transform .25s;
  }
  .cmd.dim{opacity:.35;pointer-events:none;transform:translateY(4px)}
  .cmd-btn{
    display:flex;align-items:center;gap:8px;width:100%;
    padding:8px 9px;font-family:inherit;font-size:15px;font-weight:700;
    color:#fff;background:transparent;border:none;border-radius:5px;
    cursor:pointer;text-align:left;transition:background .12s,color .12s;
  }
  .cmd-btn .cur{flex:0 0 11px;font-size:10px;color:var(--gold);opacity:0}
  .cmd-btn .sub{margin-left:auto;font-size:9.5px;font-weight:400;color:#7f95af}
  .cmd-btn.sel{background:rgba(255,212,71,.10)}
  .cmd-btn.sel .cur{opacity:1;animation:curBlink .9s steps(2,start) infinite}
  .cmd-btn:hover:not(:disabled){background:rgba(255,255,255,.06)}
  .cmd-btn:disabled{color:#6b7a8d}
  .cmd-btn:disabled .cur{opacity:0}
  @keyframes curBlink{50%{opacity:.15}}

  .msg{
    position:relative;min-height:94px;
    padding:11px 15px 15px;font-size:15px;line-height:1.8;
    display:flex;align-items:flex-start;
  }
  #msg-text{flex:1;min-width:0}
  #msg-text.fade{animation:msgIn .22s ease-out}
  @keyframes msgIn{from{opacity:.15;transform:translateY(4px)}to{opacity:1;transform:none}}
  .arrow{
    position:absolute;right:14px;bottom:8px;font-size:12px;
    animation:blink 1s steps(2,start) infinite;
  }
  @keyframes blink{50%{opacity:0}}

  /* ---------- 問題パネル ---------- */
  .qpanel{
    position:absolute;left:10px;right:10px;bottom:10px;z-index:6;
    padding:11px 14px 13px;
    animation:panelIn .22s cubic-bezier(.2,1.3,.4,1);
  }
  @keyframes panelIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .q-head{display:flex;align-items:center;gap:8px;margin-bottom:9px;font-size:11px}
  .badge{padding:2px 8px;border:1px solid #4b6d95;border-radius:3px;color:#cfe3ff;font-weight:700}
  .diff{color:var(--gold);letter-spacing:1px}
  .timer{flex:1;height:6px;background:#0c1626;border:1px solid #2a4060;border-radius:3px;overflow:hidden}
  .timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#4ade80,#ffd447)}
  #q-text{font-size:16px;line-height:1.6;font-weight:700;margin:0 0 11px}
  #q-text .sub{display:block;font-size:10px;font-weight:400;color:var(--muted);margin-top:3px}
  #q-choices{display:grid;grid-template-columns:1fr;gap:6px}
  .choice{
    display:flex;align-items:center;gap:10px;
    min-height:44px;padding:8px 11px;text-align:left;
    font-family:inherit;font-size:14px;font-weight:700;color:#fff;
    background:linear-gradient(180deg,#101f33,#0a1424);
    border:2px solid #3f5b80;border-radius:6px;cursor:pointer;
    transition:border-color .12s,background .12s,transform .08s;
  }
  .choice:hover{border-color:#a9c9ea;background:linear-gradient(180deg,#17304d,#0e1d31)}
  .choice:active{transform:translateY(1px)}
  .choice .num{
    flex:0 0 auto;width:20px;height:20px;display:flex;align-items:center;justify-content:center;
    font-size:10px;color:#bcd6f5;border:1px solid #3f5b80;border-radius:4px;
  }
  #q-feedback{padding:2px 0 4px;font-size:13px;line-height:1.65}
  #q-feedback .mark{font-weight:800;margin-right:6px;color:#ff8080}
  #q-feedback .ans{color:#fff;font-weight:800}
  #q-feedback .hint{display:block;margin-top:7px;font-size:10px;color:var(--muted)}

  /* ---------- 演出レイヤ ---------- */
  #flash{position:fixed;inset:0;z-index:40;background:#fff;opacity:0;pointer-events:none;transition:opacity .12s}
  #flash.on{opacity:.85;transition:none}
  #redflash{position:fixed;inset:0;z-index:39;background:#ff2b2b;opacity:0;pointer-events:none;transition:opacity .16s}
  #redflash.on{opacity:.30;transition:none}
  #attrflash{position:fixed;inset:0;z-index:38;pointer-events:none;opacity:0;transition:opacity .22s;background:#4fc3f7}
  #levelup{
    position:fixed;inset:0;z-index:41;display:flex;align-items:center;justify-content:center;
    pointer-events:none;opacity:0;
  }
  #levelup span{
    font-size:clamp(26px,8vw,42px);font-weight:900;letter-spacing:.14em;
    color:#fff;text-shadow:0 0 20px rgba(255,212,71,.9),0 4px 0 #4a2c00;
    background:linear-gradient(180deg,#fffbe6,#ffd447 60%,#e08a00);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  #levelup.show{animation:lu 1.5s ease-out}
  @keyframes lu{
    0%{opacity:0;transform:scale(.6)}
    18%{opacity:1;transform:scale(1.06)}
    72%{opacity:1;transform:scale(1)}
    100%{opacity:0;transform:scale(1.1)}
  }
  #bye{
    position:fixed;inset:0;z-index:50;background:#000;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    animation:fadeUp .5s ease-out;
  }
  #bye .t{font-size:16px;color:#cfe3ff;letter-spacing:.14em}
  #bye .s{font-size:11px;color:#6f86a2}

  @media (max-width:420px){
    #q-text{font-size:15px}
    .choice{font-size:13px;min-height:42px}
    .msg{font-size:14px;min-height:88px}
    .cmd-btn{font-size:13.5px;padding:7px 6px}
    .cmd-btn .sub{display:none}
    .cmd{width:min(150px,46%)}
    .hud{width:min(158px,48%);font-size:10px}
    .hud-bar .num{min-width:48px}
  }
  @media (prefers-reduced-motion:reduce){
    .logo,.logo .ch,.sub,.tbtns,.title-foot,#start::after,.tbtn.play::after{animation:none !important;opacity:1;transform:none}
  }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="boot"></div>

<!-- ================= タイトル ================= -->
<section id="title" class="screen">
  <div class="title-inner">
    <div class="logo-wrap">
      <h1 class="logo" id="logo" aria-label="STUDY QUEST"></h1>
      <p class="sub">勉強するほど強くなる。強くなるほど世界が広がる。</p>
    </div>
    <div class="tbtns">
      <button id="btn-play" class="tbtn play">PLAY</button>
      <button id="btn-exit" class="tbtn exit">EXIT</button>
    </div>
    <div class="title-foot">STUDY QUEST — 第一世界 はじまりの草原</div>
  </div>
</section>

<!-- ================= 難易度 ================= -->
<section id="grades" class="screen hide">
  <div class="grades-inner">
    <h2 class="gtitle">学習レベル</h2>
    <p class="gdesc">出題される問題の学年をえらんでください</p>

    <div class="panelbox win">
      <div class="grades">
        <div class="grp"><span class="glabel">小学</span>
          <button class="gbtn" data-g="1">1年</button>
          <button class="gbtn" data-g="2">2年</button>
          <button class="gbtn" data-g="3">3年</button>
          <button class="gbtn" data-g="4">4年</button>
          <button class="gbtn" data-g="5">5年</button>
          <button class="gbtn" data-g="6">6年</button>
        </div>
        <div class="grp"><span class="glabel">中学</span>
          <button class="gbtn" data-g="7">1年</button>
          <button class="gbtn" data-g="8">2年</button>
          <button class="gbtn" data-g="9">3年</button>
        </div>
        <div class="grp"><span class="glabel">高校</span>
          <button class="gbtn" data-g="10">1年</button>
          <button class="gbtn" data-g="11">2年</button>
          <button class="gbtn" data-g="12">3年</button>
        </div>
      </div>
      <div class="phint" id="grade-hint">出題レベル ★★</div>
    </div>

    <div class="gbtns">
      <button id="btn-back" class="tbtn exit">もどる</button>
      <button id="btn-start" class="tbtn play">はじめる</button>
    </div>
  </div>
</section>

<!-- ================= バトル ================= -->
<section id="battle" class="screen hide">
  <div class="hud-grade" id="hud-grade">小4</div>

  <div class="bottom">
    <div class="lower-row">
      <div class="hud win" id="hud">
        <div class="hud-row"><span class="who">ゆうしゃ</span><span class="lv">Lv <b id="hud-lv">1</b></span></div>
        <div class="hud-bar hp"><span>HP</span><i><b id="hud-hp-bar"></b></i><span class="num" id="hud-hp-num">100</span></div>
        <div class="hud-bar mp"><span>MP</span><i><b id="hud-mp-bar"></b></i><span class="num" id="hud-mp-num">12/13</span></div>
        <div class="hud-bar exp"><span>EXP</span><i><b id="hud-exp-bar"></b></i><span class="num" id="hud-exp-num">0/3</span></div>
        <div class="hud-weapon" id="hud-weapon">そうび: 木の棒</div>
      </div>
      <div class="cmd win" id="cmd"></div>
    </div>
    <div class="msg win">
      <span id="msg-text">…</span>
      <span class="arrow" id="msg-arrow">▼</span>
    </div>
  </div>

  <div class="qpanel win off" id="qpanel">
    <div class="q-head">
      <span class="badge" id="q-subject">数学</span>
      <span class="diff" id="q-diff">★</span>
      <span class="timer"><i id="q-timer"></i></span>
    </div>
    <p id="q-text"></p>
    <div id="q-choices"></div>
    <div id="q-feedback" class="off"></div>
  </div>
</section>

<div id="redflash"></div>
<div id="attrflash"></div>
<div id="flash"></div>
<div id="levelup"><span id="levelup-text">LEVEL UP</span></div>

<div id="bye" class="off">
  <div class="t">また ぼうけんに くるんだぞ！</div>
  <div class="s">STUDY QUEST — またね</div>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   STUDY QUEST — 第一世界
   タイトル → 難易度（小1〜高3）→ ドラクエ風ターン制バトル
   ========================================================= */

const MAX_LEVEL = 100;
const expNeed = lv => Math.round(3 + 0.2 * lv);

const ATTR_COLOR = {
  '水':'#4fc3f7', '炎':'#ff7a45', '光':'#ffe066', '大地':'#c9a165', '電気':'#b388ff'
};
const SUBJECT_ATTR = { '数学':'水', '国語':'炎', '英語':'光', '社会':'大地', '理科':'電気' };

const QUESTIONS = [
  /* ---- ★1 ---- */
  {d:1,s:'数学',u:'たし算',q:'7 + 8 はいくつ？',o:['13','15','16','17'],a:'15'},
  {d:1,s:'数学',u:'ひき算',q:'12 − 5 はいくつ？',o:['5','6','7','8'],a:'7'},
  {d:1,s:'数学',u:'かけ算',q:'3 × 4 はいくつ？',o:['7','10','12','14'],a:'12'},

/* ---------- キャンバス ---------- */
const cv = dom.bg;
const ctx = cv.getContext('2d');
let W = 1, H = 1, DPR = 1;
let safeBottom = 240;   // 下部ウィンドウ群の高さ（敵の描画位置の基準）
let bgCache = null;     // 戦闘背景のキャッシュ（サイズ変更で作り直す）

function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth || 1;
  H = window.innerHeight || 1;
  cv.width = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.imageSmoothingEnabled = false;
  buildScenery();
  bgCache = null;
}
window.addEventListener('resize', function(){ resize(); measureSafeBottom(); });

function drawSprite(c, rows, cx, bottomY, px, pal, alpha){
  pal = pal || PAL;
  const cols = rows[0].length;
  const x0 = Math.round(cx - (cols * px) / 2);
  const y0 = Math.round(bottomY - rows.length * px);
  c.globalAlpha = alpha === undefined ? 1 : alpha;
  for (let r = 0; r < rows.length; r++){
    for (let k = 0; k < cols; k++){
      const ch = rows[r][k];
      if (ch === '.') continue;
      c.fillStyle = pal[ch] || '#fff';
      c.fillRect(x0 + k * px, y0 + r * px, px, px);
    }
  }
  c.globalAlpha = 1;
}

/* ---------- 光スプライト（キャッシュ） ---------- */
const glowCache = new Map();
function glowSprite(color, size){
  const key = color + '|' + size;
  const hit = glowCache.get(key);
  if (hit) return hit;
  const c = document.createElement('canvas');
  c.width = c.height = size * 2;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(size, size, 0, size, size, size);
  gr.addColorStop(0, '#ffffff');
  gr.addColorStop(0.08, '#ffffff');
  gr.addColorStop(0.32, color);
  gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr;
  g.fillRect(0, 0, size * 2, size * 2);
  glowCache.set(key, c);
  return c;
}

/* ---------- 簡易ブルーム（1/4解像度でぼかして加算） ---------- */
let bloomC = null, bloomX = null, bloomOff = false;
function applyBloom(){
  if (bloomOff) return;
  if (!('filter' in ctx)){ bloomOff = true; return; }
  try {
    const bw = Math.max(1, cv.width >> 2), bh = Math.max(1, cv.height >> 2);
    if (!bloomC){
      bloomC = document.createElement('canvas');
      bloomX = bloomC.getContext('2d');
    }
    if (bloomC.width !== bw || bloomC.height !== bh){
      bloomC.width = bw; bloomC.height = bh;
    }
    bloomX.globalCompositeOperation = 'copy';
    bloomX.filter = 'brightness(0.78) contrast(2.5) blur(1.6px)';
    bloomX.drawImage(cv, 0, 0, bw, bh);
    bloomX.filter = 'none';
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.42;
    ctx.drawImage(bloomC, 0, 0, W, H);
    ctx.restore();
  } catch (err) {
    bloomOff = true;
  }
}

const stars = [];
const hills = [];
let slimeSpots = [];
const dust = [];
const clouds = [];
let shots = [];
let shootTimer = 3;
let raysAngle = 0;
let titleImpact = 0;

function buildScenery(){

  for (let i = 0; i < 5; i++){

  slimeSpots = [0.12, 0.3, 0.72, 0.9];

  dust.length = 0;
  for (let i = 0; i < 36; i++){
    dust.push({ x: Math.random() * W, y: Math.random() * H, r: 1 + Math.random() * 2,
                v: 8 + Math.random() * 22, a: 0.25 + Math.random() * 0.5, p: Math.random() * 6.28 });
  }
  clouds.length = 0;

      blocks: [[0, 0, 1, 0.55], [0.7, -0.28, 1.5, 0.7], [2.1, 0.05, 1.1, 0.5]]
    });
  }
  shots = [];
  shootTimer = 3;
}

/* ---------- エフェクト ---------- */
const fx = {
  numbers: [], parts: [], sparks: [], shake: 0, flash: 0,
  entrance: 0, enemyX: 0, enemyY: 0, enemyPx: 15, dissolve: 0,
  castColor: '#ffffff', castLife: 0, casts: [],
  hitPunch: 0, slow: 0
};

/* 属性ごとの火花パーティクル（軌跡つき） */
function spawnSparks(attr, color, tier, sc){
  const x = fx.enemyX, y = fx.enemyY - 44;
  const n = 24 + tier * 26;
  for (let i = 0; i < n; i++){
    let vx, vy, grav = 0, drag = 0.94, size = 2, life = 0.6, ground = false, hot = false;
    if (attr === '水'){
      const a = Math.random() * Math.PI;
      const sp = 90 + Math.random() * 210 * sc;
      vx = Math.cos(a) * sp * (Math.random() < 0.5 ? -1 : 1) * 0.75;
      vy = -Math.sin(a) * sp * 0.95 - 40;
      grav = 980; drag = 0.995; size = 1.6 + Math.random() * 2.4; life = 0.55 + Math.random() * 0.5;
    } else if (attr === '炎'){
      vx = (Math.random() - 0.5) * 110;
      vy = -70 - Math.random() * 230 * sc;
      grav = -30; drag = 0.987; size = 2 + Math.random() * 3; life = 0.65 + Math.random() * 0.7; hot = true;
    } else if (attr === '光'){
      const a = Math.random() * Math.PI * 2;
      const sp = 70 + Math.random() * 190;
      vx = Math.cos(a) * sp; vy = Math.sin(a) * sp - 50;
      grav = 0; drag = 0.93; size = 2 + Math.random() * 3; life = 0.4 + Math.random() * 0.5;
    } else if (attr === '大地'){
      const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.4;
      const sp = 150 + Math.random() * 280 * sc;
      vx = Math.cos(a) * sp * 0.85; vy = Math.min(-50, Math.sin(a) * sp);
      grav = 1350; drag = 0.997; size = 2.4 + Math.random() * 3.4; life = 0.75 + Math.random() * 0.6; ground = true;
    } else {
      const a = Math.random() * Math.PI * 2;
      const sp = 200 + Math.random() * 430;
      vx = Math.cos(a) * sp; vy = Math.sin(a) * sp;
      grav = 0; drag = 0.85; size = 1.5 + Math.random() * 2; life = 0.16 + Math.random() * 0.3;
    }
    fx.sparks.push({
      x: x, y: y, px: x, py: y, vx: vx, vy: vy, grav: grav, drag: drag,
      life: life, max: life, size: size, color: color, hot: hot, ground: ground, sw: Math.random() * 6.28
    });
  }
  if (fx.sparks.length > 700) fx.sparks.splice(0, fx.sparks.length - 700);
}
let attrTintTimer = 0;

function attrTint(color, rank){
  const el = dom.attrflash;

  el.style.opacity = String(rank >= 15 ? 0.30 : rank >= 8 ? 0.22 : 0.14);

function popNumber(text, color){
  fx.numbers.push({ text: text, color: color || '#fff', x: W / 2 + (Math.random() - 0.5) * 50, y: H * 0.4, life: 1.15, max: 1.15 });
}
function burst(x, y, color, n){
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2;
    const sp = 50 + Math.random() * 190;
    fx.parts.push({
      x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
      life: 0.55 + Math.random() * 0.4, max: 0.9, color: color, size: 2 + Math.random() * 3
    });

    fx.sparks.push({
      x: x, y: y, px: x, py: y,
      vx: Math.cos(a) * sp * 1.4, vy: Math.sin(a) * sp * 1.4 - 40,
