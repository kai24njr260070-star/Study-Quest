function whiteFlash(){ dom.flash.classList.add('on'); setTimeout(() => dom.flash.classList.remove('on'), 70); }
function redFlash(){ dom.redflash.classList.add('on'); setTimeout(() => dom.redflash.classList.remove('on'), 90); }

/* ---------- 描画ループ ---------- */
let lastT = 0;
function loop(now){
  if (!lastT) lastT = now;
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.06) dt = 0.06;
  const t = now / 1000;

  if (fx.flash > 0) fx.flash -= dt;
  if (fx.shake > 0) fx.shake -= dt;
  if (fx.hitPunch > 0) fx.hitPunch = Math.max(0, fx.hitPunch - dt * 4.2);
  let fdt = dt;
  if (fx.slow > 0){ fx.slow -= dt; fdt = dt * 0.32; }
  if (fx.entrance < 1) fx.entrance = Math.min(1, fx.entrance + dt * 3.2);
  if (fx.dissolve > 0) fx.dissolve = Math.max(0, fx.dissolve - dt * 1.6);
  if (fx.castLife > 0) fx.castLife = Math.max(0, fx.castLife - dt);
  for (const c of fx.casts) c.life -= fdt;
  fx.casts = fx.casts.filter(c => c.life > 0);

  for (const s of fx.sparks){
    s.px = s.x; s.py = s.y;
    s.life -= fdt;
    const damp = Math.pow(s.drag, fdt * 60);
    s.vx *= damp;
    s.vy = s.vy * damp + s.grav * fdt;
    s.x += s.vx * fdt;
    s.y += s.vy * fdt;
    if (s.ground && s.y > fx.enemyY - 2){
      s.y = fx.enemyY - 2;
      s.vy *= -0.42;
      s.vx *= 0.7;
      if (Math.abs(s.vy) < 40) s.vy = 0;
    }
  }
  fx.sparks = fx.sparks.filter(s => s.life > 0);

  for (const n of fx.numbers){ n.life -= dt; n.y -= 30 * dt; }
  fx.numbers = fx.numbers.filter(n => n.life > 0);
  for (const p of fx.parts){
    p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 420 * dt;
  }
  fx.parts = fx.parts.filter(p => p.life > 0);

  if (mode === 'battle'){ renderBattle(t); applyBloom(); } else renderTitleBg(t, dt);
  requestAnimationFrame(loop);
}

function renderTitleBg(t, dt){
  dt = dt || 0.016;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0b1c38');
  g.addColorStop(0.42, '#071021');
  g.addColorStop(1, '#02040a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  const hy = H * 0.76;

  // ロゴ背後の光条
  raysAngle += dt * 0.11;
  ctx.save();
  ctx.translate(W / 2, H * 0.34);
  ctx.rotate(raysAngle);
  const rayLen = Math.max(W, H) * 0.8;
  for (let i = 0; i < 14; i++){
    ctx.rotate(Math.PI * 2 / 14);
    const rg = ctx.createLinearGradient(0, 0, 0, -rayLen);
    rg.addColorStop(0, 'rgba(255,214,120,0.075)');
    rg.addColorStop(1, 'rgba(255,214,120,0)');
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-24, -rayLen);
    ctx.lineTo(24, -rayLen);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  // 月
  const mx = W * 0.8, my = H * 0.15, mr = Math.min(W, H) * 0.055;
  const mg = ctx.createRadialGradient(mx, my, mr * 0.4, mx, my, mr * 4.2);
  mg.addColorStop(0, 'rgba(255,246,214,0.28)');
  mg.addColorStop(1, 'rgba(255,246,214,0)');
  ctx.fillStyle = mg;
  ctx.beginPath(); ctx.arc(mx, my, mr * 4.2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#f7f1d2';
  ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(206,196,158,.45)';
  ctx.beginPath(); ctx.arc(mx - mr * 0.28, my - mr * 0.2, mr * 0.2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(mx + mr * 0.3, my + mr * 0.2, mr * 0.14, 0, Math.PI * 2); ctx.fill();

  // 星
  for (const s of stars){
    s.y += s.v * 0.01;
    if (s.y > 1){ s.y = 0; s.x = Math.random(); }
    const tw = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t * 1.8 + s.p));
    ctx.globalAlpha = tw * 0.85;
    ctx.fillStyle = '#cfe3ff';
    ctx.fillRect(s.x * W, s.y * H * 0.72, s.s, s.s);
  }
  ctx.globalAlpha = 1;

  // 流れ星
  shootTimer -= dt;
  if (shootTimer <= 0 && shots.length < 2){
    shootTimer = 4 + Math.random() * 5;
    shots.push({ x: W * 0.2 + Math.random() * W * 0.6, y: 20 + Math.random() * H * 0.25,
                 vx: 380 + Math.random() * 180, vy: 150 + Math.random() * 80, life: 1.1 });
  }
  for (const s of shots){
    s.life -= dt; s.x += s.vx * dt; s.y += s.vy * dt;
    ctx.globalAlpha = Math.max(0, s.life) * 0.9;
    ctx.strokeStyle = '#eaf4ff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x - s.vx * 0.09, s.y - s.vy * 0.09);
    ctx.stroke();
  }
  shots = shots.filter(function(s){ return s.life > 0; });
  ctx.globalAlpha = 1;

  // 雲
  for (const c of clouds){
    c.x += c.v * dt;
    if (c.x > 1.25) c.x = -0.25;
    ctx.fillStyle = 'rgba(150,190,240,' + c.a + ')';
    for (const blk of c.blocks){
      ctx.fillRect((c.x + blk[0]) * W, (c.y + blk[1]) * H, blk[2] * 46, blk[3] * 16);
    }
  }

  // 遠景の山
  ctx.fillStyle = 'rgba(9,18,34,.9)';
  for (const hl of hills){
    const hx = hl.x * W, hw = hl.w * W, hh = hl.h * H;
    ctx.beginPath();
    ctx.moveTo(hx - hw / 2, hy);
    ctx.lineTo(hx, hy - hh);
    ctx.lineTo(hx + hw / 2, hy);
    ctx.closePath();
    ctx.fill();
  }

  // 城内の明かり
  drawCastle(W * 0.17, hy, Math.min(W, H) / 820);

  ctx.fillStyle = 'rgba(255,212,71,0.08)';
  ctx.fillRect(0, hy, W, 2);

  // 舞い上がる光の粒
  for (const d of dust){
    d.y -= d.v * dt;
    d.x += Math.sin(t * 0.8 + d.p) * 6 * dt;
    if (d.y < -6){ d.y = H + 6; d.x = Math.random() * W; }
    ctx.globalAlpha = d.a * (0.45 + 0.55 * Math.sin(t * 2 + d.p));
    ctx.fillStyle = '#ffe9a8';
    ctx.fillRect(d.x, d.y, d.r, d.r);
  }
  ctx.globalAlpha = 1;

  // 草原のスライム
  for (let i = 0; i < slimeSpots.length; i++){
    const bob = Math.sin(t * 1.5 + i * 1.7) * 4;
    drawSprite(ctx, SPR_SLIME, slimeSpots[i] * W, H - 24 + bob, 8 + (i % 2) * 2, PAL, 0.75);
  }

  // ロゴ着地の衝撃波
  if (titleImpact > 0){
    titleImpact = Math.max(0, titleImpact - dt * 1.5);
    const p = 1 - titleImpact;
    ctx.globalAlpha = titleImpact * 0.75;
    ctx.strokeStyle = '#ffe9a8';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(W / 2, H * 0.36, 30 + p * Math.min(W, H) * 0.6, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

function drawCastle(cx, baseY, s){
  if (!s || s <= 0) s = 1;
  const w = 42 * s, h = 48 * s;
  ctx.fillStyle = 'rgba(6,12,24,.95)';
  ctx.fillRect(cx - w, baseY - h, w * 2, h);
  ctx.fillRect(cx - w * 1.38, baseY - h * 1.36, w * 0.62, h * 1.36);
  ctx.fillRect(cx + w * 0.76, baseY - h * 1.36, w * 0.62, h * 1.36);
  ctx.beginPath();
  ctx.moveTo(cx - w * 1.38, baseY - h * 1.36);
  ctx.lineTo(cx - w * 1.07, baseY - h * 1.64);
  ctx.lineTo(cx - w * 0.76, baseY - h * 1.36);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx + w * 0.76, baseY - h * 1.36);
  ctx.lineTo(cx + w * 1.07, baseY - h * 1.64);
  ctx.lineTo(cx + w * 1.38, baseY - h * 1.36);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx - w * 0.56, baseY - h);
  ctx.lineTo(cx, baseY - h * 1.32);
  ctx.lineTo(cx + w * 0.56, baseY - h);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,206,110,.6)';
  const lights = [[-0.78,0.52],[0.86,0.58],[-0.1,0.48],[0.3,0.74],[-0.42,0.76]];
  for (const L of lights){
    ctx.fillRect(cx + L[0] * w, baseY - L[1] * h, Math.max(2, 3 * s), Math.max(3, 5 * s));
  }
}

function renderBattle(t){
  const hy = Math.max(110, Math.min(H * 0.56, H - safeBottom - 18));
  if (!bgCache) buildBattleBackdrop(hy);
  ctx.drawImage(bgCache, 0, 0, W, H);

  // たいまつの明かり
  const glow = ctx.createRadialGradient(W / 2, hy * 0.82, 10, W / 2, hy * 0.82, Math.min(W, H) * 0.55);
  glow.addColorStop(0, 'rgba(255,196,90,0.12)');
  glow.addColorStop(1, 'rgba(255,196,90,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  drawBattleAmbience(t, hy);

  // カメラシェイク（背景は固定し、敵とエフェクトだけ揺らす）
  ctx.save();
  if (fx.shake > 0){
    const amp = fx.shake * 34;
    ctx.translate(W / 2, H / 2);
    ctx.rotate((Math.random() - 0.5) * fx.shake * 0.05);
    ctx.translate(-W / 2, -H / 2);
    ctx.translate((Math.random() - 0.5) * amp, (Math.random() - 0.5) * amp);
  }

  const e = S.enemy;
  if (e){
    const bob = Math.sin(t * 2.1) * 4;
    const shakeX = 0;
    const px = Math.max(9, Math.round(e.px * (W < 420 ? 0.8 : 1)));
    const bottom = hy + bob + (1 - fx.entrance) * 90;

    fx.enemyX = W / 2;
    fx.enemyY = bottom;
    fx.enemyPx = px;

    // 影（中心が濃く、外側へほどける）
    ctx.save();
    ctx.translate(W / 2, hy + 4);
    ctx.scale(1, 0.24);
    const shadowR = px * 4.6;
    const sg = ctx.createRadialGradient(0, 0, 0, 0, 0, shadowR);
    sg.addColorStop(0, 'rgba(0,0,0,0.66)');
    sg.addColorStop(0.55, 'rgba(0,0,0,0.36)');
    sg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = sg;
    ctx.beginPath();
    ctx.arc(0, 0, shadowR, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    const alpha = fx.dissolve > 0 ? fx.dissolve : 1;
    drawSprite(ctx, e.sprite, W / 2 + shakeX, bottom, Math.max(6, Math.round(px * (1 + fx.hitPunch * 0.14))), fx.flash > 0 ? WHITE_PAL : PAL, alpha);

    if (S.boss){
      const bw = Math.min(300, W * 0.66), bh = 9;
      const bx = (W - bw) / 2, by = 118;
      ctx.fillStyle = 'rgba(0,0,0,.75)';
      ctx.fillRect(bx - 2, by - 2, bw + 4, bh + 4);
      ctx.fillStyle = '#33100f';
      ctx.fillRect(bx, by, bw, bh);
      ctx.fillStyle = '#ff5d5d';
      ctx.fillRect(bx, by, bw * Math.max(0, e.hp / e.maxHp), bh);
      ctx.fillStyle = '#fff';
      ctx.font = '11px ui-monospace, monospace';
      ctx.textAlign = 'center';
      ctx.fillText(e.name, W / 2, by - 6);
    }
  }

  ctx.globalCompositeOperation = 'lighter';
  for (const p of fx.parts){
    const gs = glowSprite(p.color, 12);
    const s = p.size * 5;
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life / p.max * 1.6));
    ctx.drawImage(gs, p.x - s / 2, p.y - s / 2, s, s);
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;

  // 火花（軌跡つき）
  if (fx.sparks.length){
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    for (const s of fx.sparks){
      const k = Math.max(0, Math.min(1, s.life / s.max));
      const col = s.hot ? (k > 0.6 ? '#fff3c4' : (k > 0.3 ? '#ffb35c' : '#ff5a1f')) : s.color;
      ctx.globalAlpha = k * 0.95;
      ctx.strokeStyle = col;
      ctx.lineWidth = Math.max(0.6, s.size * k);
      ctx.beginPath();
      ctx.moveTo(s.px, s.py);
      ctx.lineTo(s.x, s.y);
      ctx.stroke();
      const gs = glowSprite(col, 12);
      const sz = s.size * 7 * (0.4 + k * 0.8);
      ctx.globalAlpha = k * 0.85;
      ctx.drawImage(gs, s.x - sz / 2, s.y - sz / 2, sz, sz);
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  }

  // じゅもんの発動リング
  if (fx.castLife > 0){
    const p = 1 - fx.castLife / 0.65;
    ctx.globalAlpha = Math.max(0, fx.castLife / 0.65);
    ctx.strokeStyle = fx.castColor;
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.arc(fx.enemyX, fx.enemyY - fx.enemyPx * 4, 18 + p * 130, 0, Math.PI * 2);
    ctx.stroke();
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(fx.enemyX, fx.enemyY - fx.enemyPx * 4, 40 + p * 170, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  renderCasts();

  ctx.textAlign = 'center';
  for (const n of fx.numbers){
    const a = Math.min(1, n.life / n.max * 2);
    ctx.globalAlpha = a;
    ctx.font = 'bold 24px ui-monospace, monospace';
    ctx.fillStyle = '#000';
    ctx.fillText(n.text, W / 2 + 2, n.y + 2);
    ctx.fillStyle = n.color;
    ctx.fillText(n.text, W / 2, n.y);
  }
  ctx.globalAlpha = 1;

  // 着弾のビネットパルス（画面の縁が締まる）
  if (fx.hitPunch > 0.01){
    const vg = ctx.createRadialGradient(W / 2, H * 0.46, Math.min(W, H) * 0.18, W / 2, H * 0.46, Math.max(W, H) * 0.78);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,' + (0.62 * fx.hitPunch).toFixed(3) + ')');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  ctx.restore();

  // 常時のビネット（上下を締める）
  const vg2 = ctx.createRadialGradient(W / 2, H * 0.45, Math.min(W, H) * 0.25, W / 2, H * 0.45, Math.max(W, H) * 0.72);
  vg2.addColorStop(0, 'rgba(0,0,0,0)');
  vg2.addColorStop(1, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = vg2;
  ctx.fillRect(0, 0, W, H);
}

/* 戦闘背景を一度だけ描き込む（描き込み量が多いのでキャッシュ） */

function buildBattleBackdrop(hy){
  const c = document.createElement('canvas');
  c.width = cv.width; c.height = cv.height;
  const g = c.getContext('2d');
  g.setTransform(DPR, 0, 0, DPR, 0, 0);

  /* --- 洞窟の奥行き（空気遠近） --- */
  const sky = g.createLinearGradient(0, 0, 0, hy);
  sky.addColorStop(0, '#03060c');
  sky.addColorStop(0.45, '#07101d');
  sky.addColorStop(0.8, '#0e1e33');
  sky.addColorStop(1, '#1b3350');
  g.fillStyle = sky;
  g.fillRect(0, 0, W, hy + 2);

  // 奥から差し込む月明かり（光の筋）
  g.save();
  g.globalCompositeOperation = 'lighter';
  if ('filter' in g) g.filter = 'blur(16px)';
  const shaft = g.createLinearGradient(W * 0.62, 0, W * 0.38, hy);
  shaft.addColorStop(0, 'rgba(150,190,255,0.055)');
  shaft.addColorStop(0.7, 'rgba(150,190,255,0.03)');
  shaft.addColorStop(1, 'rgba(150,190,255,0)');
  g.fillStyle = shaft;
  g.beginPath();
  g.moveTo(W * 0.52, 0);
  g.lineTo(W * 0.72, 0);
  g.lineTo(W * 0.52, hy);
  g.lineTo(W * 0.2, hy);
  g.closePath();
  g.fill();
  if ('filter' in g) g.filter = 'none';
  g.restore();

  /* --- 遠景の岩壁（3層） --- */
  const layers = [
    { base: hy - 6, amp: H * 0.26, rim: 'rgba(120,175,235,0.20)', body: '#152c45', step: 36 },
    { base: hy - 1, amp: H * 0.19, rim: 'rgba(90,145,205,0.16)', body: '#0c1c2e', step: 54 },
    { base: hy + 3, amp: H * 0.13, rim: 'rgba(70,120,180,0.13)', body: '#050b14', step: 78 }
  ];
  for (let li = 0; li < layers.length; li++){
    const L = layers[li];
    // 遠い層ほど少しぼかして空気遠近を出す
    if ('filter' in g) g.filter = li === 0 ? 'blur(2.2px)' : li === 1 ? 'blur(0.9px)' : 'none';
    const pts = [];
    let x = -30, s = Math.random() * 10;
    while (x < W + 30){
      s += 1.25;
      const ridge = Math.abs(Math.sin(s * 0.9) * Math.cos(s * 0.43));
      pts.push([x, L.base - L.amp * (0.28 + 0.72 * Math.pow(ridge, 0.65))]);
      x += L.step * (0.45 + Math.abs(Math.cos(s)) * 1.15);
    }
    // 不透明の岩 silhouette
    g.beginPath();
    g.moveTo(-30, L.base + 60);
    for (const p of pts) g.lineTo(p[0], p[1]);
    g.lineTo(W + 30, L.base + 60);
    g.closePath();
    g.fillStyle = L.body;
    g.fill();
    // 稜線の明かり
    g.strokeStyle = L.rim;
    g.lineWidth = 1.7;
    g.beginPath();
    pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]));
    g.stroke();
    // 面の陰影（岩肌の割れ）
    for (let i = 1; i < pts.length - 1; i += 2){
      const p = pts[i];
      g.globalAlpha = 0.5;
      g.fillStyle = '#000';
      g.beginPath();
      g.moveTo(p[0], p[1]);
      g.lineTo(p[0] + L.step * 0.8, L.base);
      g.lineTo(p[0] + L.step * 0.2, L.base);
      g.closePath();
      g.fill();
      g.globalAlpha = 1;
    }
    if ('filter' in g) g.filter = 'none';
  }

  // 地平線のもや
  const fog = g.createLinearGradient(0, hy - 40, 0, hy + 16);
  fog.addColorStop(0, 'rgba(120,170,230,0)');
  fog.addColorStop(0.6, 'rgba(120,170,230,0.10)');
  fog.addColorStop(1, 'rgba(120,170,230,0)');
  g.fillStyle = fog;
  g.fillRect(0, hy - 40, W, 56);

  /* --- 天井と鍾乳石 --- */
  g.fillStyle = '#02050a';
  g.beginPath();
  g.moveTo(0, 0);
  g.lineTo(W, 0);
  g.lineTo(W, H * 0.085);
  let cx2 = W;
  while (cx2 > -10){
    cx2 -= 30 + Math.random() * 70;
    g.lineTo(cx2, H * 0.085 - Math.random() * H * 0.05);
  }
  g.closePath();
  g.fill();
  for (let i = 0; i < 16; i++){
    const sx = Math.random() * W;
    const w2 = 6 + Math.random() * 26;
    const h2 = 20 + Math.random() * (H * 0.14);
    const lg = g.createLinearGradient(0, H * 0.07, 0, H * 0.07 + h2);
    lg.addColorStop(0, '#050b14');
    lg.addColorStop(1, 'rgba(5,11,20,0)');
    g.fillStyle = lg;
    g.beginPath();
    g.moveTo(sx - w2, H * 0.07);
    g.lineTo(sx, H * 0.07 + h2);
    g.lineTo(sx + w2, H * 0.07);
    g.closePath();
    g.fill();
  }

  /* --- 床（遠近感のある石畳） --- */
  const floorH = H - hy;
  const fg = g.createLinearGradient(0, hy, 0, H);
  fg.addColorStop(0, '#1a2f47');
  fg.addColorStop(0.35, '#142539');
  fg.addColorStop(1, '#080f19');
  g.fillStyle = fg;
  g.fillRect(0, hy, W, floorH);

  // 床の石畳（消失点に収束する遠近グリッド）
  const vpx = W / 2, vpy = hy - 6;
  const rowN = 13, colN = 16;
  const ys = [];
  for (let r = 0; r <= rowN; r++) ys.push(hy + Math.pow(r / rowN, 2.15) * floorH);
  const K = 2.3;
  for (let r = 0; r < rowN; r++){
    const y0 = ys[r], y1 = ys[r + 1];
    const d0 = Math.max(1, y0 - vpy), d1 = Math.max(1, y1 - vpy);
    const depth = (r + 1) / rowN;
    for (let c2 = 0; c2 < colN; c2++){
      const a0 = (c2 / colN - 0.5) * 2, a1 = ((c2 + 1) / colN - 0.5) * 2;
      const x00 = vpx + a0 * d0 * K, x10 = vpx + a1 * d0 * K;
      const x01 = vpx + a0 * d1 * K, x11 = vpx + a1 * d1 * K;
      if (Math.max(x10, x11) < -20 || Math.min(x00, x01) > W + 20) continue;
      const base = 40 + depth * 36 + Math.random() * 16;
      g.fillStyle = 'rgba(' + base.toFixed(0) + ',' + (base * 1.5).toFixed(0) + ',' + (base * 2.2).toFixed(0) + ',' + (0.30 + depth * 0.40).toFixed(2) + ')';
      g.beginPath();
      g.moveTo(x00, y0); g.lineTo(x10, y0); g.lineTo(x11, y1); g.lineTo(x01, y1);
      g.closePath();
      g.fill();
      // 目地
      g.strokeStyle = 'rgba(3,8,14,' + (0.5 - depth * 0.2).toFixed(2) + ')';
      g.lineWidth = Math.max(0.6, depth * 1.6);
      g.stroke();
      // 奥側の縁の明かり
      g.strokeStyle = 'rgba(170,210,255,' + (0.05 + depth * 0.10).toFixed(2) + ')';
      g.lineWidth = Math.max(0.5, depth * 1.1);
      g.beginPath(); g.moveTo(x00, y0); g.lineTo(x10, y0); g.stroke();
    }
  }
  g.globalAlpha = 1;

  // 手前の絞り（足元を暗くして奥行きを出す）
  const nearDark = g.createLinearGradient(0, H - floorH * 0.55, 0, H);
  nearDark.addColorStop(0, 'rgba(0,0,0,0)');
  nearDark.addColorStop(1, 'rgba(0,0,0,0.55)');
  g.fillStyle = nearDark;
  g.fillRect(0, H - floorH * 0.55, W, floorH * 0.55);

  // 床の細かい亀裂
  g.strokeStyle = 'rgba(0,0,0,0.32)';
  for (let i = 0; i < 14; i++){
    const d = Math.pow(Math.random(), 0.6);
    const y2 = hy + 6 + d * floorH * 0.7;
    let x2 = Math.random() * W;
    g.lineWidth = 0.6 + d * 1.8;
    g.beginPath();
    g.moveTo(x2, y2);
    for (let k = 0; k < 3; k++){
      x2 += (Math.random() - 0.5) * 30 * (0.4 + d);
      g.lineTo(x2, y2 + (Math.random() - 0.5) * 6 * (0.3 + d));
    }
    g.stroke();
  }

  // 床の照り返し（地平線）
  const rim = g.createLinearGradient(0, hy - 2, 0, hy + 10);
  rim.addColorStop(0, 'rgba(180,220,255,0.22)');
  rim.addColorStop(1, 'rgba(180,220,255,0)');
  g.fillStyle = rim;
  g.fillRect(0, hy - 2, W, 12);

  bgCache = c;
}

/* 戦闘フィールドの環境演出（霧・たいまつ・魔方陣・舞う塵） */
function drawBattleAmbience(t, hy){
  // 地霧
  for (let i = 0; i < 3; i++){
    const y = hy + Math.sin(t * 0.6 + i * 1.7) * 5;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const fg = ctx.createLinearGradient(0, y - 34, 0, y + 22);
    fg.addColorStop(0, 'rgba(130,180,255,0)');
    fg.addColorStop(0.55, 'rgba(130,180,255,0.055)');
    fg.addColorStop(1, 'rgba(130,180,255,0)');
    ctx.fillStyle = fg;
    ctx.fillRect(0, y - 34, W, 56);
    ctx.restore();
  }

  // たいまつ
  const torches = [W * 0.12, W * 0.88];
  for (let i = 0; i < torches.length; i++){
    const tx = torches[i], ty = hy - 52;
    const lg = ctx.createRadialGradient(tx, ty, 4, tx, ty, 105);
    lg.addColorStop(0, 'rgba(255,186,96,0.24)');
    lg.addColorStop(1, 'rgba(255,140,60,0)');
    ctx.fillStyle = lg;
    ctx.beginPath(); ctx.arc(tx, ty, 105, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2a1b12';
    ctx.fillRect(tx - 2, ty, 4, 26);
    ctx.fillRect(tx - 6, ty, 12, 4);
    const fl = 0.72 + 0.22 * Math.sin(t * 9 + i * 2.3) + 0.08 * Math.sin(t * 19 + i);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const g1 = glowSprite('#ffb14a', 24);
    const s1 = 44 * fl;
    ctx.globalAlpha = 0.85;
    ctx.drawImage(g1, tx - s1 / 2, ty - s1 * 0.66, s1, s1 * 1.1);
    const g2 = glowSprite('#fff0b8', 12);
    const s2 = 15 * fl;
    ctx.globalAlpha = 0.95;
    ctx.drawImage(g2, tx - s2 / 2, ty - s2 * 0.75, s2, s2);
    ctx.restore();
  }

  // 敵の足元の魔方陣
  if (fx.entrance > 0.9){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.translate(W / 2, hy + 6);
    ctx.scale(1, 0.32);
    const a0 = 0.16 + 0.08 * Math.sin(t * 1.6);
    ctx.globalAlpha = a0;
    ctx.strokeStyle = '#8fd0ff';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, 76, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, 62, 0, Math.PI * 2); ctx.stroke();
    ctx.rotate(t * 0.3);
    ctx.setLineDash([16, 12]);
    ctx.beginPath(); ctx.arc(0, 0, 69, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([6, 20]);
    ctx.globalAlpha = a0 * 0.9;
    ctx.beginPath(); ctx.arc(0, 0, 50, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  // 漂う塵
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const gs3 = glowSprite('#cfe6ff', 8);
  for (let i = 0; i < 16; i++){
    const ph = (t * 0.09 + i * 0.061) % 1;
    const mx = ((i * 73) % 100) / 100 * W + Math.sin(t * 0.7 + i * 1.3) * 16;
    const my = H * 0.9 - ph * (H * 0.75);
    ctx.globalAlpha = 0.16 * Math.sin(ph * Math.PI);
    ctx.drawImage(gs3, mx - 4, my - 4, 8 * (0.6 + ph), 8 * (0.6 + ph));
  }
  ctx.restore();
}

/* ---------- 呪文エフェクト ---------- */
function spawnCastFx(sp){
  const color = ATTR_COLOR[sp.attr] || '#fff';
  const rank = sp.rank || 1;
  const tier = rank <= 7 ? 1 : rank <= 14 ? 2 : 3;   // 演出の段階
  const sc = 1 + (rank - 1) * 0.045;                  // 規模
  const parts = [];
  const n = 10 + rank * 2;
  for (let i = 0; i < n; i++){
    parts.push({
      dx: (Math.random() - 0.5) * 130 * sc,
      r: 2 + Math.random() * 3,
      sp: 0.5 + Math.random() * 0.9,
      ph: Math.random() * 6.28
    });
  }
  const bolts = [];
  for (let b = 0; b < 2 + tier; b++){
    const pts = [];
    for (let k = 0; k <= 10; k++){
      pts.push({ x: (Math.random() - 0.5) * 40, y: k / 10 });
    }
    bolts.push(pts);
  }
  fx.casts.push({
    attr: sp.attr, color: color, rank: rank, tier: tier, sc: sc,
    x: fx.enemyX, y: fx.enemyY, px: fx.enemyPx,
    life: 0.75 + tier * 0.15, max: 0.75 + tier * 0.15,
    parts: parts, bolts: bolts, ph: Math.random() * 6.28
  });

  spawnSparks(sp.attr, color, tier, sc);
  fx.hitPunch = 1;
  if (tier >= 3) fx.slow = 0.13;
}

function renderCasts(){
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const c of fx.casts){
    const p = 1 - c.life / c.max;
    const a = Math.max(0, Math.min(1, c.life / c.max * 1.5));
    const x = c.x, y = c.y, sc = c.sc;

    ctx.globalAlpha = a * 0.5;
    const gr = ctx.createRadialGradient(x, y - 40, 2, x, y - 40, 90 * sc);
    gr.addColorStop(0, c.color);
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(x, y - 40, 90 * sc, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;

    if (c.attr === '水') drawWaterCast(c, p, a, x, y, sc);
    else if (c.attr === '炎') drawFireCast(c, p, a, x, y, sc);
    else if (c.attr === '光') drawLightCast(c, p, a, x, y, sc);
    else if (c.attr === '大地') drawEarthCast(c, p, a, x, y, sc);
    else drawBoltCast(c, p, a, x, y, sc);
    drawCastImpact(c, p, a, x, y, sc);
  }
  ctx.restore();
}

/* 共通の着弾演出（閃光・衝撃波・放射光条） */
function drawCastImpact(c, p, a, x, y, sc){
  const cy = y - 44;

  const capR = Math.max(W, H) * 0.36;

  // 閃光（一瞬だけ強く出す）
  if (p < 0.2){
    const f = 1 - p / 0.2;
    const gs = glowSprite('#ffffff', 64);
    const s = Math.min(capR * 1.1, 80 + 110 * sc) * (0.75 + p);
    ctx.globalAlpha = f * a * 0.8;
    ctx.drawImage(gs, x - s / 2, cy - s / 2, s, s);
    ctx.globalAlpha = 1;
  }

  // 衝撃波リング
  const rings = 1 + c.tier;
  for (let i = 0; i < rings; i++){
    const q = Math.min(1, p * (1.7 - i * 0.28));
    if (q <= 0) continue;
    ctx.globalAlpha = (1 - q) * a * 0.9;
    ctx.strokeStyle = c.color;
    ctx.lineWidth = Math.max(1, (6 - i * 1.6) * sc);
    ctx.beginPath();
    ctx.arc(x, cy, Math.min(capR, (12 + q * 155 * sc) * (1 + i * 0.2)), 0, Math.PI * 2);
    ctx.stroke();
  }

  // 放射する光条
  if (c.tier >= 2){
    const n = 8 + c.tier * 4;
    const L = (30 + 130 * sc) * Math.sin(Math.min(1, p * 3) * Math.PI * 0.5);
    ctx.globalAlpha = a * 0.5 * (1 - p);
    ctx.strokeStyle = c.color;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (let i = 0; i < n; i++){
      const ang = (i / n) * Math.PI * 2 + c.ph;
      ctx.moveTo(x + Math.cos(ang) * 12, cy + Math.sin(ang) * 12);
      ctx.lineTo(x + Math.cos(ang) * (12 + L), cy + Math.sin(ang) * (12 + L));
    }
    ctx.stroke();
  }
  drawAttrSignature(c, p, a, x, y, sc);
  ctx.globalAlpha = 1;
}

/* 属性ごとの上乗せ演出（収束・光条・煙・亀裂・放電） */
function drawAttrSignature(c, p, a, x, y, sc){
  const cy = y - 44;

  /* 発動前：光が中心に集まる */
  if (p < 0.18){
    const q = Math.max(0, p / 0.18);
    const gs = glowSprite(c.color, 16);
    const n = 10 + c.tier * 6;
    for (let i = 0; i < n; i++){
      const ang = (i / n) * Math.PI * 2 + p * 7;
      const rr = (160 * sc) * (1 - q * q) + 8;
      const sz = 12 + 16 * q;
      const sx = x + Math.cos(ang) * rr;
      const sy = cy + Math.sin(ang) * rr * 0.8;
      ctx.globalAlpha = a * (0.25 + 0.75 * q);
      ctx.drawImage(gs, sx - sz / 2, sy - sz / 2, sz, sz);
    }
    ctx.globalAlpha = 1;
  }

  const b = Math.max(0, (p - 0.08) / 0.92);   // 着弾後の進行度

  if (c.attr === '水'){
    /* 王冠スプラッシュ */
    const k = Math.min(1, b * 2.2);
    const gs = glowSprite('#d6f4ff', 12);
    for (let i = 0; i <= 8; i++){
      const ang = -Math.PI + (i / 8) * Math.PI;
      const r = (26 + 84 * sc) * k;
      const sx = x + Math.cos(ang) * r;
      const sy = y - Math.sin(ang) * r * 0.55 - 6;
      ctx.globalAlpha = a * (1 - k) * 0.9;
      ctx.drawImage(gs, sx - 10, sy - 10, 20, 20);
    }
    /* 水柱のハイライト */
    const h = (60 + 150 * sc) * Math.min(1, p * 2.2);
    ctx.globalAlpha = a * 0.55;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x - 2 * sc, y - h, 2.5 * sc, h * 0.78);
    ctx.fillRect(x + 5 * sc, y - h * 0.7, 1.6 * sc, h * 0.5);
    /* 霧 */
    for (let i = 0; i < 3; i++){
      const q = Math.min(1, p * 1.5 - i * 0.14);
      if (q <= 0) continue;
      ctx.globalAlpha = a * 0.11 * (1 - q);
      ctx.fillStyle = '#e3f7ff';
      ctx.beginPath();
      ctx.ellipse(x + (i - 1) * 28 * sc, y - 28 - q * 74 * sc, (24 + q * 42) * sc, (9 + q * 19) * sc, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  else if (c.attr === '炎'){
    /* 白熱のコア */
    const k = Math.min(1, b * 1.7);
    const gs = glowSprite('#fff0b8', 32);
    const s = (66 + 96 * sc) * (0.75 + k * 0.7);
    ctx.globalAlpha = a * (1 - k * 0.85) * 0.95;
    ctx.drawImage(gs, x - s / 2, y - s / 2 - 30, s, s);
    /* 舞い上がる残り火 */
    for (let i = 0; i < 14; i++){
      const ph = (p * 1.5 + i * 0.087) % 1;
      const sx = x + Math.sin(i * 2.1 + p * 5) * 48 * sc;
      const sy = y - ph * 205 * sc;
      const g = glowSprite(i % 2 ? '#ffb35c' : '#ff6a2a', 8);
      const sz = 8 * (1 - ph * 0.5);
      ctx.globalAlpha = a * 0.85 * (1 - ph);
      ctx.drawImage(g, sx - sz / 2, sy - sz / 2, sz, sz);
    }
    /* 煙（加算しない） */
    ctx.globalCompositeOperation = 'source-over';
    for (let i = 0; i < 4; i++){
      const q = Math.min(1, b * 1.25 - i * 0.11);
      if (q <= 0) continue;
      ctx.globalAlpha = a * 0.17 * (1 - q);
      ctx.fillStyle = '#2a1a12';
      ctx.beginPath();
      ctx.arc(x + (i - 1.5) * 24 * sc + Math.sin(p * 6 + i) * 10, cy - q * 96 * sc, (22 + q * 48) * sc, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'lighter';
  }
  else if (c.attr === '光'){
    /* 回転する光条 */
    ctx.save();
    ctx.translate(x, cy);
    ctx.rotate(p * 2.6 + c.ph);
    const rays = 6 + c.tier * 2;
    const L = (110 + 170 * sc) * Math.min(1, p * 3.2);
    for (let i = 0; i < rays; i++){
      ctx.rotate(Math.PI * 2 / rays);
      const rg = ctx.createLinearGradient(0, 0, 0, -L);
      rg.addColorStop(0, 'rgba(255,247,200,0.6)');
      rg.addColorStop(1, 'rgba(255,247,200,0)');
      ctx.globalAlpha = a * 0.75;
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(-4 - 3 * c.tier, -L);
      ctx.lineTo(4 + 3 * c.tier, -L);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
    /* レンズフレア */
    const flares = [[0.42, 9, '#ffffff'], [0.78, 17, '#ffe9a8'], [1.15, 11, '#a8d8ff'], [1.55, 24, '#ffd36b']];
    for (const f of flares){
      const g = glowSprite(f[2], 32);
      const s = f[1] * 2 * sc * (0.85 + Math.sin(p * 9 + f[0] * 3) * 0.15);
      const sx = x + 120 * sc * f[0], sy = cy + 42 * sc * f[0];
      ctx.globalAlpha = a * 0.45 * (1 - p);
      ctx.drawImage(g, sx - s / 2, sy - s / 2, s, s);
    }
    /* 星のきらめき */
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    for (let i = 0; i < 7; i++){
      const ph = (p * 1.9 + i * 0.16) % 1;
      const sx = x + Math.cos(i * 2.4) * 92 * sc;
      const sy = cy + Math.sin(i * 1.7) * 72 * sc;
      const ll = 13 * (1 - ph) * sc;
      ctx.globalAlpha = a * (1 - ph);
      ctx.beginPath();
      ctx.moveTo(sx - ll, sy); ctx.lineTo(sx + ll, sy);
      ctx.moveTo(sx, sy - ll); ctx.lineTo(sx, sy + ll);
      ctx.stroke();
    }
  }
  else if (c.attr === '大地'){
    /* 地面の亀裂 */
    const k = Math.min(1, p * 2.2);
    const fade = 1 - Math.max(0, p - 0.55) / 0.45;
    ctx.strokeStyle = c.color;
    ctx.lineWidth = 2.4 * sc;
    for (let i = 0; i < 7; i++){
      const ang = Math.PI + (i / 6) * Math.PI;
      const len = (44 + 96 * sc) * k;
      ctx.globalAlpha = a * 0.85 * fade;
      ctx.beginPath();
      ctx.moveTo(x, y + 2);
      for (let s = 1; s <= 3; s++){
        ctx.lineTo(x + Math.cos(ang) * (len / 3) * s + (Math.random() - 0.5) * 10,
                   y + 2 + Math.sin(ang) * (len / 3) * s * 0.32 + (Math.random() - 0.5) * 5);
      }
      ctx.stroke();
    }
    /* 舞い上がる土煙 */
    ctx.globalCompositeOperation = 'source-over';
    for (let i = 0; i < 5; i++){
      const q = Math.min(1, b * 1.45 - i * 0.1);
      if (q <= 0) continue;
      ctx.globalAlpha = a * 0.21 * (1 - q);
      ctx.fillStyle = '#6b5236';
      ctx.beginPath();
      ctx.ellipse(x + (i - 2) * 27 * sc, y - 5 - q * 28 * sc, (28 + q * 42) * sc, (11 + q * 17) * sc, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'lighter';
  }
  else {
    /* 分岐する放電 */
    ctx.strokeStyle = '#e6d4ff';
    ctx.lineWidth = 1.6;
    for (let bch = 0; bch < 3; bch++){
      const ang = c.ph + bch * 2.1 + p * 3;
      let lx = x, ly = cy;
      ctx.globalAlpha = a * 0.75;
      ctx.beginPath();
      ctx.moveTo(lx, ly);
      for (let s = 1; s <= 5; s++){
        lx += Math.cos(ang + Math.sin(s * 1.7 + p * 9 + bch) * 0.9) * 22 * sc;
        ly += Math.sin(ang + Math.cos(s * 1.3 + p * 7 + bch) * 0.9) * 22 * sc;
        ctx.lineTo(lx, ly);
      }
      ctx.stroke();
    }
    /* プラズマ球 */
    const g = glowSprite('#d9c2ff', 32);
    const s2 = (48 + 62 * sc) * (1 - p * 0.55);
    ctx.globalAlpha = a * (1 - p) * 0.9;
    ctx.drawImage(g, x - s2 / 2, cy - s2 / 2, s2, s2);
  }

  ctx.globalAlpha = 1;
}

function drawWaterCast(c, p, a, x, y, sc){
  // 波紋
  const rings = 2 + c.tier;
  for (let i = 0; i < rings; i++){
    const q = (p + i * 0.14) % 1;
    ctx.globalAlpha = a * 0.5 * (1 - q);
    ctx.strokeStyle = '#c8efff';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.ellipse(x, y + 4, 16 + q * 118 * sc, 6 + q * 32 * sc, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
  // 水柱（楕円を積んで形を作る）
  const h = (70 + 160 * sc) * Math.min(1, p * 2.2);
  const cols = 1 + (c.tier >= 2 ? 2 : 0);
  for (let i = 0; i < cols; i++){
    const off = i === 0 ? 0 : (i === 1 ? -1 : 1) * (15 + 11 * sc);
    const hh = i === 0 ? h : h * (0.5 + 0.22 * Math.abs(Math.sin(p * 7 + i)));
    const w0 = (i === 0 ? 15 : 8) * sc;
    for (let k = 0; k < 8; k++){
      const t2 = k / 7;
      const ww = w0 * (1 - t2 * 0.76) * (1 + 0.16 * Math.sin(p * 14 + k * 1.6 + i));
      ctx.globalAlpha = a * (1 - t2 * 0.85) * (i === 0 ? 0.95 : 0.6);
      ctx.fillStyle = t2 < 0.35 ? '#eafaff' : '#7fd0f7';
      ctx.beginPath();
      ctx.ellipse(x + off * (0.6 + t2 * 0.7), y - t2 * hh, ww, ww * 0.92, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  // 水滴
  const gs = glowSprite('#d6f4ff', 8);
  for (const q of c.parts){
    const t2 = Math.min(1, p * q.sp * 1.6);
    const yy = y - 170 * sc * t2 + 190 * sc * t2 * t2;
    const sz = q.r * 2.6;
    ctx.globalAlpha = a * 0.9 * (1 - t2 * 0.3);
    ctx.drawImage(gs, x + q.dx * (0.3 + t2) - sz / 2, yy - sz / 2, sz, sz);
  }
  ctx.globalAlpha = 1;
}

function drawFireCast(c, p, a, x, y, sc){
  // 立ちのぼる炎の柱（光の玉を積層）
  const H2 = (85 + 170 * sc) * Math.min(1, p * 2);
  for (let k = 0; k < 10; k++){
    const t2 = k / 9;
    const wob = Math.sin(p * 9 + k * 1.3) * 7 * sc;
    const wv = (18 - t2 * 12) * sc * (1 + 0.22 * Math.sin(p * 13 + k * 1.7));
    const col = t2 < 0.16 ? '#fff3c4' : t2 < 0.42 ? '#ffd45e' : t2 < 0.72 ? '#ffa347' : '#ff5a1f';
    const g = glowSprite(col, 32);
    const sz = wv * 2.4;
    ctx.globalAlpha = a * (1 - t2 * 0.9) * 0.62;
    ctx.drawImage(g, x + wob - sz / 2, y - t2 * H2 - sz * 0.55, sz, sz * 1.15);
  }
  // 火の粒
  for (const q of c.parts){
    const t2 = p * q.sp;
    const yy = y - t2 * 185 * sc;
    const xx = x + q.dx * (0.5 + t2 * 0.6);
    const sz = q.r * 2.6 * sc;
    const g = glowSprite(t2 < 0.5 ? '#ffd166' : '#ff7a45', 8);
    ctx.globalAlpha = a * Math.max(0, 0.92 - t2 * 0.5);
    ctx.drawImage(g, xx - sz / 2, yy - sz / 2, sz, sz);
  }
  ctx.globalAlpha = 1;
}

function drawLightCast(c, p, a, x, y, sc){
  // 降りそそぐ光条（下に向かって細く、先端で消える）
  const beams = 2 + c.tier * 2;
  const gr = ctx.createLinearGradient(0, 0, 0, y);
  gr.addColorStop(0, 'rgba(255,251,224,0.85)');
  gr.addColorStop(0.65, 'rgba(255,251,224,0.16)');
  gr.addColorStop(1, 'rgba(255,251,224,0)');
  ctx.fillStyle = gr;
  for (let i = 0; i < beams; i++){
    const bx = x + (i - (beams - 1) / 2) * 26 * sc;
    const w = (6 + 9 * Math.abs(Math.sin(p * 8 + i))) * sc;
    ctx.globalAlpha = a * 0.8;
    ctx.beginPath();
    ctx.moveTo(bx - w * 0.35, 0);
    ctx.lineTo(bx + w * 0.35, 0);
    ctx.lineTo(bx + w, y);
    ctx.lineTo(bx - w, y);
    ctx.closePath();
    ctx.fill();
  }
  // 高ランクは十字の閃光
  if (c.tier >= 3){
    const L = 180 * sc * Math.min(1, p * 3);
    const g2 = ctx.createRadialGradient(x, y - 44, 0, x, y - 44, Math.max(1, L * 0.55));
    g2.addColorStop(0, 'rgba(255,255,240,0.95)');
    g2.addColorStop(1, 'rgba(255,224,102,0)');
    ctx.fillStyle = g2;
    ctx.globalAlpha = a * 0.85;
    ctx.beginPath(); ctx.arc(x, y - 44, L * 0.55, 0, Math.PI * 2); ctx.fill();
    ctx.fillRect(x - L / 2, y - 46, L, 4 * sc);
    ctx.fillRect(x - 2 * sc, y - 44 - L / 2, 4 * sc, L);
  }
  ctx.globalAlpha = 1;
}

function drawEarthCast(c, p, a, x, y, sc){
  ctx.strokeStyle = c.color;
  ctx.lineWidth = 3;
  const cracks = 3 + c.tier;
  for (let i = 0; i < cracks; i++){
    const dir = i % 2 ? 1 : -1;
    const len = (30 + 60 * sc) * Math.min(1, p * 2.5);
    ctx.globalAlpha = a * 0.75;
    ctx.beginPath();
    ctx.moveTo(x + dir * (i * 6), y + 4);
    ctx.lineTo(x + dir * (14 + i * 10), y + 2 - len * 0.35);
    ctx.lineTo(x + dir * (26 + i * 14), y + 4);
    ctx.stroke();
  }
  // 舞い上がる岩塊（多角形＋上面のハイライト）
  for (const q of c.parts){
    const t2 = p * q.sp;
    const rx2 = x + q.dx;
    const ry2 = y - t2 * 150 * sc;
    const s = q.r * 2.2;
    ctx.globalAlpha = a * 0.95;
    ctx.fillStyle = '#8a6a42';
    ctx.beginPath();
    ctx.moveTo(rx2 - s, ry2);
    ctx.lineTo(rx2 - s * 0.4, ry2 - s * 1.3);
    ctx.lineTo(rx2 + s * 0.7, ry2 - s * 0.9);
    ctx.lineTo(rx2 + s, ry2 + s * 0.2);
    ctx.lineTo(rx2 - s * 0.3, ry2 + s * 0.5);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = a * 0.45;
    ctx.fillStyle = c.color;
    ctx.beginPath();
    ctx.moveTo(rx2 - s * 0.4, ry2 - s * 1.3);
    ctx.lineTo(rx2 + s * 0.7, ry2 - s * 0.9);
    ctx.lineTo(rx2 + s * 0.1, ry2 - s * 0.2);
    ctx.closePath();
    ctx.fill();
  }
  if (c.tier >= 2){
    ctx.globalAlpha = a * 0.5;
    ctx.strokeStyle = c.color;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.ellipse(x, y + 6, 30 + p * 220 * sc, 10 + p * 40 * sc, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawBoltCast(c, p, a, x, y, sc){
  const flick = 0.45 + 0.55 * Math.abs(Math.sin(p * 26 + c.ph));
  for (let bi = 0; bi < c.bolts.length; bi++){
    const pts = c.bolts[bi];
    const baseX = x + (bi - (c.bolts.length - 1) / 2) * 40 * sc;
    ctx.beginPath();
    for (let k = 0; k < pts.length; k++){
      const px2 = baseX + pts[k].x * sc * 1.6;
      const py2 = pts[k].y * (y - 30);
      if (k === 0) ctx.moveTo(px2, py2); else ctx.lineTo(px2, py2);
    }
    ctx.globalAlpha = a * flick;
    ctx.strokeStyle = '#f6efff';
    ctx.lineWidth = 2.5 * sc;
    ctx.stroke();
    ctx.globalAlpha = a * flick * 0.45;
    ctx.strokeStyle = c.color;
    ctx.lineWidth = 8 * sc;
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

/* ---------- HUD ---------- */
function updateHUD(){
  dom.lv.textContent = S.level;
  const hpPct = Math.max(0, S.hp) / S.maxHp * 100;
  dom.hpBar.style.width = hpPct + '%';
  $('hud').classList.toggle('danger', hpPct <= 25);
  dom.hpNum.textContent = Math.max(0, Math.round(S.hp)) + '/' + S.maxHp;
  const need = expNeed(S.level);
  const expPct = S.level >= MAX_LEVEL ? 100 : Math.min(100, S.exp / need * 100);
  dom.expBar.style.width = expPct + '%';
  dom.expNum.textContent = S.level >= MAX_LEVEL ? 'MAX' : S.exp + '/' + need;
  const mm = mpMax();
  dom.mpBar.style.width = Math.max(0, Math.min(100, S.mp / mm * 100)) + '%';
  dom.mpNum.textContent = Math.max(0, S.mp) + '/' + mm;
  dom.weapon.textContent = 'そうび: ' + S.weapon.n + '  ATK ' + S.weapon.atk + ' / ★' + S.weapon.req;
  dom.grade.textContent = GRADE_LABEL[S.grade] || '';
}

/* ---------- 画面遷移 ---------- */
function showScreen(name){
  mode = name;
  dom.title.classList.toggle('hide', name !== 'title');
  dom.grades.classList.toggle('hide', name !== 'grades');
  dom.battle.classList.toggle('hide', name !== 'battle');
}

/* ---------- メッセージ ---------- */
let skipFn = null;
const wait = ms => new Promise(r => setTimeout(r, ms));

function say(text, delay){
  if (delay === undefined) delay = 950;
  return new Promise(resolve => {
    dom.msgText.textContent = text;
    dom.msgText.classList.remove('fade');
    void dom.msgText.offsetWidth;
    dom.msgText.classList.add('fade');
    dom.msgArrow.style.visibility = 'visible';
    let done = false;
    const finish = () => {
      if (done) return;
      done = true;
      clearTimeout(timer);
      skipFn = null;
      dom.msgArrow.style.visibility = 'hidden';
      resolve();
    };
    const timer = setTimeout(finish, delay);
    skipFn = finish;
  });
}
function skipMessage(){ if (skipFn) skipFn(); }
dom.msgText.parentElement.addEventListener('click', skipMessage);

/* ---------- コマンド ---------- */
const COMMANDS = [
  { id:'attack', label:'たたかう', sub:'もんだいを とく' },
  { id:'magic',  label:'じゅもん', sub:'MPを つかう' },
  { id:'defend', label:'ぼうぎょ', sub:'ダメージ げん' },
  { id:'flee',   label:'にげる',   sub:'たたかいから にげる' },
  { id:'boss',   label:'世界ボス', sub:'Lv100で かいきん', bossOnly:true }
];
let cursorId = null;
let spellState = null;        // null | 'elements' | 'list'
let currentAttr = null;

function measureSafeBottom(){
  const el = document.querySelector('#battle .bottom');
  if (el) safeBottom = Math.round(el.getBoundingClientRect().height);
  bgCache = null;
}

function renderCommands(){
  spellState = null;
  dom.cmd.innerHTML = '';
  COMMANDS.forEach(c => {
    if (c.bossOnly && !(S.bossUnlocked && !S.bossDefeated && !S.boss)) return;
    const b = document.createElement('button');
    b.className = 'cmd-btn';
    b.dataset.id = c.id;
    b.innerHTML = '<span class="cur">▶</span><span>' + c.label + '</span><span class="sub">' + c.sub + '</span>';
    b.addEventListener('click', () => { cursorId = c.id; paintCursor(); selectCommand(c.id); });
    b.addEventListener('mouseenter', () => { cursorId = c.id; paintCursor(); });
    dom.cmd.appendChild(b);
  });
  paintCursor();
  measureSafeBottom();
}

function paintCursor(){
  const btns = [].slice.call(dom.cmd.querySelectorAll('.cmd-btn'));
  const enabled = btns.filter(b => !b.disabled);
  if (!enabled.length) return;
  if (!enabled.some(b => b.dataset.id === cursorId)) cursorId = enabled[0].dataset.id;
  btns.forEach(b => { b.classList.toggle('sel', b.dataset.id === cursorId); });
  if (spellState) showCursorInfo();
}

function showCursorInfo(){
  dom.msgArrow.style.visibility = 'hidden';
  if (cursorId === 'back'){
    dom.msgText.textContent = spellState === 'list' ? '属性を えらびなおす' : 'コマンドに もどる';
    return;
  }
  if (spellState === 'elements'){
    const attr = String(cursorId).replace('el:', '');
    dom.msgText.textContent = attr + '属性（' + ELEM_SUBJECT[attr] + '）の じゅもん';
    return;
  }
  const sp = SPELLS.find(s => s.id === cursorId);
  if (!sp) return;
  const est = Math.round((8 + S.level * 1.6) * sp.power);
  dom.msgText.textContent = sp.name + '【' + sp.subject + '・' + sp.attr + '】★' + sp.diff +
    '　' + sp.mp + 'MP　いりょく やく' + est;
}
function visibleCommands(){
  return [].slice.call(dom.cmd.querySelectorAll('.cmd-btn')).filter(b => !b.disabled);
}
function moveCursor(dir){
  const btns = visibleCommands();
  if (!btns.length) return;
  let i = btns.findIndex(b => b.dataset.id === cursorId);
  if (i < 0) i = 0;
  i = (i + dir + btns.length) % btns.length;
  cursorId = btns[i].dataset.id;
  paintCursor();
}
function confirmCursor(){
  const sel = dom.cmd.querySelector('.cmd-btn.sel');
  if (!sel) return;
  const id = sel.dataset.id;
  if (spellState){
    if (id === 'back'){
      if (spellState === 'list') openSpellMenu(); else closeSpellMenu();
      return;
    }
    if (id.indexOf('el:') === 0) return openSpellList(id.slice(3));
    return chooseSpell(id);
  }
  selectCommand(id);
}

/* ---------- じゅもんメニュー（属性 → 呪文の2段階） ---------- */
function addBackButton(){
  const back = document.createElement('button');
  back.className = 'cmd-btn';
  back.dataset.id = 'back';
  back.innerHTML = '<span class="cur">▶</span><span>もどる</span><span class="sub"></span>';
  back.addEventListener('click', function(){
    if (spellState === 'list') openSpellMenu(); else closeSpellMenu();
  });
  back.addEventListener('mouseenter', function(){ cursorId = 'back'; paintCursor(); });
  dom.cmd.appendChild(back);
}

function openSpellMenu(){
  if (!S.canCommand) return;
  spellState = 'elements';
  currentAttr = null;
  cursorId = null;
  dom.cmd.innerHTML = '';
  ELEMENTS.forEach(function(attr){
    const learned = SPELLS.filter(s => s.attr === attr && S.level >= s.lv).length;
    const total = SPELL_NAMES[attr].length;
    const b = document.createElement('button');
    b.className = 'cmd-btn';
    b.dataset.id = 'el:' + attr;
    b.innerHTML = '<span class="cur">▶</span>' +
      '<span style="color:' + (ATTR_COLOR[attr] || '#fff') + '">' + attr + '</span>' +
      '<span class="sub">' + ELEM_SUBJECT[attr] + ' ' + learned + '/' + total + '</span>';
    b.addEventListener('click', function(){ openSpellList(attr); });
    b.addEventListener('mouseenter', function(){ cursorId = 'el:' + attr; paintCursor(); });
    dom.cmd.appendChild(b);
  });
  addBackButton();
  paintCursor();
  measureSafeBottom();
}

function openSpellList(attr){
  if (!S.canCommand) return;
  spellState = 'list';
  currentAttr = attr;
  cursorId = null;
  dom.cmd.innerHTML = '';
  SPELLS.filter(s => s.attr === attr).forEach(function(sp){
    const locked = S.level < sp.lv;
    const b = document.createElement('button');
    b.className = 'cmd-btn';
    b.dataset.id = sp.id;
    b.disabled = locked;
    b.innerHTML = '<span class="cur">▶</span>' +
      '<span style="color:' + (locked ? '#6b7a8d' : (ATTR_COLOR[attr] || '#fff')) + '">' + sp.name + '</span>' +
      '<span class="sub">' + (locked ? 'Lv' + sp.lv : sp.mp + 'MP ★' + sp.diff) + '</span>';
    b.addEventListener('click', function(){ chooseSpell(sp.id); });
    b.addEventListener('mouseenter', function(){ cursorId = sp.id; paintCursor(); });
    dom.cmd.appendChild(b);
  });
  addBackButton();
  paintCursor();
  measureSafeBottom();
}

function closeSpellMenu(){
  spellState = null;
  cursorId = 'magic';
  renderCommands();
  promptCommand();
  measureSafeBottom();
}

function chooseSpell(id){
  if (id === 'back'){
    if (spellState === 'list') return openSpellMenu();
    return closeSpellMenu();
  }
  const sp = SPELLS.find(s => s.id === id);
  if (!sp) return;
  spellState = null;
  return doMagic(sp);
}

function promptCommand(){
  dom.msgText.textContent = 'コマンド？';
  dom.msgArrow.style.visibility = 'hidden';
}

function setCommands(on){
  S.canCommand = on;
  dom.cmd.classList.toggle('dim', !on);
  visibleCommands().forEach(b => { b.disabled = !on; });
  if (on){
    renderCommands();
    promptCommand();
  }
}

async function selectCommand(id){
  if (!S.canCommand) return;
  if (id === 'attack') return doAttack();
  if (id === 'magic') return openSpellMenu();
  if (id === 'defend') return doDefend();
  if (id === 'flee') return doFlee();
  if (id === 'boss') return startBattle(true);
}

/* ---------- 出題 ---------- */
const usedCount = new Map();

function pickQuestion(diffs, subject){
  let pool = QUESTIONS.filter(q => diffs.indexOf(q.d) !== -1 && (!subject || q.s === subject));
  if (!pool.length && subject) pool = QUESTIONS.filter(q => q.s === subject);
  if (!pool.length) pool = QUESTIONS.filter(q => diffs.indexOf(q.d) !== -1);
  if (!pool.length) pool = QUESTIONS.slice();
  let min = Infinity;
  for (const q of pool) min = Math.min(min, usedCount.get(q.q) || 0);
  const cand = pool.filter(q => (usedCount.get(q.q) || 0) === min);
  return cand[Math.floor(Math.random() * cand.length)];
}
function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function askQuestion(diffs, subject){
  return new Promise(resolve => {
    const q = pickQuestion(diffs, subject);
    usedCount.set(q.q, (usedCount.get(q.q) || 0) + 1);
    const options = shuffle(q.o);
    const total = S.boss ? 25 : 15;
    let remaining = total, done = false, locked = false, timerId = null;

    dom.qSubject.textContent = q.s;
    dom.qSubject.style.color = ATTR_COLOR[SUBJECT_ATTR[q.s]];
    dom.qSubject.style.borderColor = ATTR_COLOR[SUBJECT_ATTR[q.s]] + '99';
    dom.qDiff.textContent = '★'.repeat(q.d) + '☆'.repeat(5 - q.d);
    dom.qText.innerHTML = q.q + '<span class="sub">' + q.s + ' / ' + q.u + '</span>';
    dom.qTimer.style.width = '100%';

    dom.qChoices.innerHTML = '';
    options.forEach((opt, i) => {
      const b = document.createElement('button');
      b.className = 'choice';
      b.innerHTML = '<span class="num">' + (i + 1) + '</span><span>' + opt + '</span>';
      b.addEventListener('click', () => choose(i));
      dom.qChoices.appendChild(b);
    });
    dom.qFeedback.classList.add('off');
    dom.qChoices.style.display = '';
    dom.qpanel.classList.remove('off');

    function finish(ok){
      if (done) return;
      done = true;
      clearInterval(timerId);
      dom.qpanel.classList.add('off');
      resolve({ ok: ok, q: q });
    }
    function wrong(){
      if (done || locked) return;
      locked = true;
      clearInterval(timerId);
      dom.qChoices.style.display = 'none';
      dom.qFeedback.innerHTML =
        '<span class="mark">× 不正解</span>せいかいは <span class="ans">' + q.a + '</span><br>' +
        (EXPL[q.q] || 'もう一度、解き方を確認しよう。') +
        '<span class="hint">▼ タップで たたかいに もどる（こうげき失敗）</span>';
      dom.qFeedback.classList.remove('off');
      dom.qFeedback.onclick = () => finish(false);
      setTimeout(() => finish(false), 3600);
    }
    function choose(i){
      if (done || locked) return;
      if (options[i] === q.a){ locked = true; finish(true); }
      else wrong();
    }
    timerId = setInterval(() => {
      remaining -= 0.1;
      const pct = Math.max(0, remaining / total * 100);
      dom.qTimer.style.width = pct + '%';
      dom.qTimer.style.background = pct < 30
        ? 'linear-gradient(90deg,#ff5d5d,#ffd447)'
        : 'linear-gradient(90deg,#4ade80,#ffd447)';
      if (remaining <= 0){ clearInterval(timerId); wrong(); }
    }, 100);
  });
}

/* ---------- ダメージ ---------- */
function calcDamage(q, e){
  const attr = SUBJECT_ATTR[q.s];
  const atk = S.weapon.atk * 0.7 + S.level * 0.6;
  const attrMult = e.weak === attr ? 1.5 : 1.0;
  const comboMult = Math.min(2.0, 1 + 0.1 * S.combo);
  const reqMult = q.d < S.weapon.req ? 0.5 : 1.0;
  const raw = atk * attrMult * comboMult * reqMult;
  return { dmg: Math.max(1, Math.round(raw) - e.def), attr: attr, weak: e.weak === attr };
}

function calcMagic(sp, e){
  const base = 8 + S.level * 1.6;
  const attrMult = e.weak === sp.attr ? 1.5 : 1.0;
  const comboMult = Math.min(2.0, 1 + 0.1 * S.combo);
  const raw = base * sp.power * attrMult * comboMult;
  return { dmg: Math.max(1, Math.round(raw - e.def * 0.35)), weak: e.weak === sp.attr };
}

/* ---------- 敵 ---------- */
function pickType(){
  const lv = S.level, r = Math.random();
  if (lv < 20) return r < 0.85 ? 'slime' : 'goblin';
  if (lv < 50) return r < 0.5 ? 'slime' : r < 0.9 ? 'goblin' : 'hobgoblin';
  if (lv < 80) return r < 0.25 ? 'slime' : r < 0.7 ? 'goblin' : 'hobgoblin';
  return r < 0.35 ? 'goblin' : 'hobgoblin';
}
function makeEnemy(isBoss){
  const type = isBoss ? 'king' : pickType();
  const base = ENEMY_DEF[type];
  const scale = isBoss ? 1 : 1 + S.level * 0.05;
  const hp = Math.round(base.hp * scale);
  return {
    type: type, name: base.name, hp: hp, maxHp: hp,
    def: base.def + (isBoss ? 0 : Math.floor(S.level / 30)),
    atk: Math.round(base.atk + (isBoss ? 0 : S.level * 0.5)),
    exp: Math.round(base.exp * (isBoss ? 1 : 1 + S.level * 0.03)),
    weak: base.weak, sprite: base.sprite, tier: base.tier, px: base.px
  };
}

/* ---------- 戦闘開始 ---------- */
async function startBattle(isBoss){
  if (isBoss && (!S.bossUnlocked || S.bossDefeated)) return;
  showScreen('battle');
  S.boss = !!isBoss;
  S.defending = false;
  S.enemy = makeEnemy(isBoss);
  S.phase = 'intro';
  setCommands(false);
  fx.entrance = 0;
  fx.dissolve = 0;
  fx.numbers = [];
  fx.parts = [];
  fx.casts = [];
  fx.sparks = [];
  fx.hitPunch = 0;
  fx.slow = 0;
  updateHUD();
  renderCommands();
  whiteFlash();
  await wait(260);
  await say(S.enemy.name + 'が あらわれた！', 900);
  S.phase = 'command';
  setCommands(true);
}

/* ---------- プレイヤーの行動 ---------- */
async function doAttack(){
  if (!S.canCommand || !S.enemy || S.phase !== 'command') return;
  S.phase = 'question';
  setCommands(false);

  const res = await askQuestion(S.boss ? [5] : (GRADE_BAND[S.grade] || [1]));
  S.answers++;

  if (res.ok){
    S.correct++;
    S.combo++;
    S.bestCombo = Math.max(S.bestCombo, S.combo);
    const calc = calcDamage(res.q, S.enemy);
    const dmg = Math.min(calc.dmg, S.enemy.hp);
    S.enemy.hp -= dmg;

    fx.flash = 0.15;
    fx.shake = 0.18;
    popNumber(String(dmg), calc.weak ? '#ffd447' : '#ffffff');
    burst(fx.enemyX, fx.enemyY - fx.enemyPx * 4, calc.weak ? '#ffd447' : '#cfe3ff', calc.weak ? 18 : 10);

    let msg = S.enemy.name + 'に ' + dmg + 'の ダメージ！';
    if (calc.weak) msg += '  弱点をついた！';
    await say(msg, 950);

    if (S.enemy.hp <= 0){ await victory(); return; }
  } else {
    S.combo = 0;
    await say('もんだいを まちがえた！  こうげきは はずれた！', 1150);
  }

  updateHUD();
  await enemyTurn();
}

async function doMagic(sp){
  if (!S.canCommand || !S.enemy || S.phase !== 'command') return;
  spellState = null;

  if (S.mp < sp.mp){
    setCommands(false);
    await say('MPが たりない！', 900);
    S.phase = 'command';
    setCommands(true);
    return;
  }

  S.phase = 'question';
  renderCommands();
  setCommands(false);

  // 強い呪文ほど難しい問題になる（呪文ごとの要求★を使う）
  const res = await askQuestion([sp.diff], sp.subject);
  S.answers++;
  S.mp -= sp.mp;
  updateHUD();

  if (res.ok){
    S.correct++;
    S.combo++;
    S.bestCombo = Math.max(S.bestCombo, S.combo);
    const calc = calcMagic(sp, S.enemy);
    const dmg = Math.min(calc.dmg, S.enemy.hp);
    S.enemy.hp -= dmg;

    fx.flash = 0.16;
    fx.shake = (sp.attr === '大地' || sp.attr === '電気') ? 0.34 : 0.22;
    fx.castColor = ATTR_COLOR[sp.attr] || '#fff';
    fx.castLife = 0.65;
    popNumber(String(dmg), ATTR_COLOR[sp.attr] || '#fff');
    burst(fx.enemyX, fx.enemyY - fx.enemyPx * 4, ATTR_COLOR[sp.attr] || '#fff', 14 + sp.rank);
    spawnCastFx(sp);
    attrTint(ATTR_COLOR[sp.attr] || '#fff', sp.rank);

    let msg = sp.name + '！  ' + S.enemy.name + 'に ' + dmg + 'の ダメージ！';
    if (calc.weak) msg += '  弱点をついた！';
    await say(msg, 1050);

    if (S.enemy.hp <= 0){ await victory(); return; }
  } else {
    S.combo = 0;
    await say(sp.name + 'は ふきとばされた！  こうげき失敗…', 1200);
  }

  updateHUD();
  await enemyTurn();
}

async function doDefend(){
  if (!S.canCommand || !S.enemy || S.phase !== 'command') return;
  setCommands(false);
  S.defending = true;
  await say('ゆうしゃは みを まもっている！', 850);
  await enemyTurn();
}

async function doFlee(){
  if (!S.canCommand || !S.enemy || S.phase !== 'command') return;
  setCommands(false);
  if (S.boss){
    await say('世界ボスからは にげられない！', 1000);
    S.phase = 'command';
    setCommands(true);
    return;
  }
  if (Math.random() < 0.8){
    await say('ゆうしゃは にげだした！', 900);
    S.enemy = null;
    S.combo = 0;
    updateHUD();
    await wait(250);
    await startBattle(false);
  } else {
    await say('しかし まわりこまれてしまった！', 950);
    await enemyTurn();
  }
}

/* ---------- 敵のターン ---------- */
async function enemyTurn(){
  if (!S.enemy) return;
  S.phase = 'enemy';
  const e = S.enemy;
  await wait(160);
  await say(e.name + 'の こうげき！', 750);

  let dmg = Math.max(1, Math.round(e.atk * (0.85 + Math.random() * 0.3)) - Math.floor(S.level * 0.6));
  if (S.defending){
    dmg = Math.max(1, Math.round(dmg * 0.4));
    S.defending = false;
  }
  S.hp -= dmg;
  updateHUD();
  redFlash();
  fx.shake = 0.22;
  await say('ゆうしゃは ' + dmg + 'の ダメージを うけた！', 950);

  if (S.hp <= 0){
    S.hp = 0;
    updateHUD();
    await defeat();
    return;
  }
  S.phase = 'command';
  setCommands(true);
}

/* ---------- 勝利 ---------- */
function rollDrop(e){
  const table = DROP_TABLE[e.tier];
  if (!table) return null;
  const r = Math.random();
  let acc = 0, rarity = null;
  for (const [rar, p] of table){
    acc += p;
    if (r <= acc){ rarity = rar; break; }
  }
  if (!rarity) return null;
  const pool = WEAPONS[rarity];
  const w = pool[Math.floor(Math.random() * pool.length)];
  return { n: w.n, atk: w.atk, req: w.req, attr: w.attr || null, rarity: rarity };
}

function showLevelUp(text){
  dom.levelupText.textContent = text;
  dom.levelup.classList.remove('show');
  void dom.levelup.offsetWidth;
  dom.levelup.classList.add('show');
}

async function victory(){
  S.phase = 'victory';
  const e = S.enemy;
  S.kills++;
  fx.dissolve = 1;
  burst(fx.enemyX, fx.enemyY - fx.enemyPx * 3, '#ffd447', 26);
  await say(e.name + 'を たおした！', 950);
  S.exp += e.exp;
  S.mp = Math.min(mpMax(), S.mp + 2);
  updateHUD();
  await say('けいけんち ' + e.exp + ' を かくとく！', 850);

  const drop = rollDrop(e);
  if (drop){
    const better = drop.atk > S.weapon.atk;
    await say(drop.n + 'を てにいれた！', 950);
    if (better){
      S.weapon = { n: drop.n, atk: drop.atk, req: drop.req, attr: drop.attr };
      updateHUD();
      await say(drop.n + 'を そうびした！（ATK ' + drop.atk + '）', 950);
    }
  }

  while (S.level < MAX_LEVEL && S.exp >= expNeed(S.level)){
    S.exp -= expNeed(S.level);
    S.level++;
    S.maxHp += 6;
    S.hp = Math.min(S.maxHp, S.hp + 30);
    S.mp = mpMax();
    updateHUD();
    showLevelUp('LEVEL UP!  Lv ' + S.level);
    await say('レベルが あがった！  Lv ' + S.level, 1000);
    const learned = SPELLS.filter(function(sp){ return sp.lv === S.level; });
    if (learned.length){
      const names = learned.map(function(sp){ return sp.name; });
      if (names.length <= 3){
        await say('じゅもん「' + names.join('」「') + '」を おぼえた！', 1250);
      } else {
        await say('じゅもんを ' + names.length + 'つ おぼえた！（' + names.slice(0, 2).join('・') + ' など）', 1250);
      }
    }
  }
  if (S.level >= MAX_LEVEL) S.exp = 0;
  updateHUD();

  if (S.boss){
    S.bossDefeated = true;
    S.boss = false;
    S.enemy = null;
    setCommands(false);
    await wait(300);
    showVictory();
    return;
  }
  if (!S.bossUnlocked && S.level >= MAX_LEVEL){
    S.bossUnlocked = true;
    S.enemy = null;
    setCommands(false);
    updateHUD();
    renderCommands();
    await wait(200);
    showBossUnlock();
    return;
  }

  S.enemy = null;
  await wait(250);
  await startBattle(false);
}

/* ---------- 敗北 ---------- */
async function defeat(){
  S.phase = 'dead';
  setCommands(false);
  await say('ゆうしゃは たおれてしまった…', 1100);
  await say('しかし きぼうは うしなわれていない。', 900);
  S.hp = S.maxHp;
  S.combo = 0;
  updateHUD();
  await say('ゆうしゃは たちあがった！（HP かいふく）', 1000);
  await startBattle(S.boss);
}

/* ---------- 結果オーバーレイ ---------- */
function statsHTML(){
  const rate = S.answers ? Math.round(S.correct / S.answers * 100) : 0;
  return '<div class="rows">' +
    '<div class="r"><span>レベル</span><span>Lv ' + S.level + '</span></div>' +
    '<div class="r"><span>といた問題</span><span>' + S.answers + ' 問</span></div>' +
    '<div class="r"><span>正答率</span><span>' + rate + ' %</span></div>' +
    '<div class="r"><span>さいだい れんぞく</span><span>' + S.bestCombo + '</span></div>' +
    '<div class="r"><span>たおした敵</span><span>' + S.kills + '</span></div>' +
    '</div>';
}

async function showBossUnlock(){
  await say('世界ボスへの とびらが ひらいた！', 1100);
  await say('コマンドの「世界ボス」から いどめる。', 1100);
  S.phase = 'command';
  await startBattle(false);
}

async function showVictory(){
  await say('スライムキングを うちたおした！', 1200);
  await say('記憶の欠片を とりもどした。', 1100);
  await say('第二世界 アクアリスへの みちが ひらけた！', 1400);
  await say('※ プロトタイプは ここまで。' + '  Lv' + S.level + ' / 正答率' +
    (S.answers ? Math.round(S.correct / S.answers * 100) : 0) + '%', 3000);
  await say('タイトルに もどる…', 1200);
  showScreen('title');
  S.boss = false;
}

/* ---------- タイトル／難易度 ---------- */
const logoEl = dom.logo;
logoEl.innerHTML = ['STUDY','QUEST'].map(function(word, li){
  return '<span class="line">' + word.split('').map(function(ch, i){
    const delay = 0.25 + (li * 5 + i) * 0.075;
    return '<span class="ch" style="animation-delay:' + delay.toFixed(2) + 's">' + ch + '</span>';
  }).join('') + '</span>';
}).join('');

const gradeBtns = [].slice.call(document.querySelectorAll('.gbtn'));
function selectGrade(g){
  selectedGrade = g;
  gradeBtns.forEach(function(b){ b.classList.toggle('on', +b.dataset.g === g); });
  const band = GRADE_BAND[g];
  $('grade-hint').textContent = '出題レベル ' + band.map(function(d){ return '★'.repeat(d); }).join('〜') +
    '（' + GRADE_LABEL[g] + '相当）';
}
gradeBtns.forEach(function(b){
  b.addEventListener('click', function(){ selectGrade(+b.dataset.g); });
});
selectGrade(selectedGrade);

$('btn-play').addEventListener('click', function(){
  showScreen('grades');
});
$('btn-back').addEventListener('click', function(){
  showScreen('title');
});
$('btn-exit').addEventListener('click', function(){
  dom.bye.classList.remove('off');
  setTimeout(function(){
    dom.bye.classList.add('off');
    showScreen('title');
  }, 2000);
});
$('btn-start').addEventListener('click', function(){
  S.grade = selectedGrade;
  updateHUD();
  startBattle(false);
});

/* ---------- キー操作 ---------- */
window.addEventListener('keydown', function(e){
  if (e.code === 'Space' || e.key === 'Enter'){
    if (skipFn){ e.preventDefault(); skipMessage(); return; }
    if (mode === 'battle' && S.canCommand){ e.preventDefault(); confirmCursor(); }
    return;
  }
  if (mode === 'battle' && S.canCommand){
    if (e.key === 'Escape' && spellState){
      e.preventDefault();
      if (spellState === 'list') openSpellMenu(); else closeSpellMenu();
      return;
    }
    if (e.key === 'ArrowUp' || e.key === 'w'){ e.preventDefault(); moveCursor(-1); }
    if (e.key === 'ArrowDown' || e.key === 's'){ e.preventDefault(); moveCursor(1); }
  }
  if (/^[1-4]$/.test(e.key) && !dom.qpanel.classList.contains('off')){
    const b = dom.qChoices.querySelectorAll('.choice')[parseInt(e.key, 10) - 1];
    if (b) b.click();
  }
});

/* ---------- 起動シーケンス ---------- */
const SUB_TEXT = '勉強するほど強くなる。強くなるほど世界が広がる。';
let introPlayed = false;

function typeSubtitle(){
  const sub = document.querySelector('.sub');
  sub.textContent = '';
  let i = 0;
  const timer = setInterval(function(){
    i++;
    sub.textContent = SUB_TEXT.slice(0, i);
    if (i >= SUB_TEXT.length) clearInterval(timer);
  }, 46);
}

function playTitleIntro(){
  if (introPlayed) return;
  introPlayed = true;
  document.querySelector('.sub').textContent = '';
  dom.boot.classList.remove('clear');

  // 1) 黒から閃光
  setTimeout(function(){
    dom.boot.classList.add('clear');
    whiteFlash();
    dom.title.classList.add('go');
  }, 320);

  // 2) ロゴが叩きつけられる
  setTimeout(function(){
    dom.logo.classList.add('go');
    titleImpact = 1;
    const inner = document.querySelector('.title-inner');
    inner.classList.add('shake');
    setTimeout(function(){ inner.classList.remove('shake'); }, 520);
  }, 1050);

  // 3) サブタイトルのタイプライター
  setTimeout(typeSubtitle, 1800);

  // 4) ボタンがせり上がる
  setTimeout(function(){ dom.title.classList.add('ready'); }, 2000);
}

/* ---------- 起動 ---------- */
resize();
renderCommands();
updateHUD();
showScreen('title');
requestAnimationFrame(loop);
playTitleIntro();

// 検証用フック
window.__SQ = { state: S, questions: QUESTIONS, startBattle: startBattle, showScreen: showScreen,
                fx: fx, spells: SPELLS, bloom: function(){ return { off: bloomOff, w: bloomC ? bloomC.width : 0, h: bloomC ? bloomC.height : 0 }; }, get mode(){ return mode; } };
})();
